<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análise de Ativos — My Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* ===== tokens — espelhados do app (claro) ===== */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f3f5f9; --line:#e6eaf0; --line2:#eef1f5;
  --ink:#1c2233; --ink2:#4b5563; --muted:#6b7280; --soft:#9aa3b2;
  --accent:#2f80f6; --accent-bg:#e8f0fd; --accent-ink:#1d6fe0; --navy:#2b3a55; --navy-ink:#fff;
  --tint-blue:#e8f0fb; --tint-gray:#eceff4; --tint-blue2:#dfeafb;
  --thead:#2b3a55; --thead-ink:#ffffff; --row-hover:#f7f9fd; --hi:#f3f7fd;
  --s1:#0079f2; --s2:#b07110; --grid:#eef1f5; --axis:#9aa3b2;
  --pad3:#1d6fe0; --pad2:#7fb0f5; --pad1:#c9dcf6;
  --ok:#16a34a; --ok-bg:#e7f6ee; --warn:#d97706; --warn-bg:#fdf1e2; --bad:#dc2626; --bad-bg:#fde8e8;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --f:'Albert Sans',system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1a1d24; --surface:#22262f; --surface2:#1e222a; --line:#2e333d; --line2:#2a2f39;
  --ink:#eef1f6; --ink2:#c9d0db; --muted:#9aa3b2; --soft:#6f7887;
  --accent:#3b8cff; --accent-bg:#233247; --accent-ink:#7db4ff; --navy:#333b4d; --navy-ink:#eef1f6;
  --tint-blue:#1f2a3d; --tint-gray:#262a33; --tint-blue2:#1b2b45;
  --thead:#2e3a52; --thead-ink:#eef1f6; --row-hover:#262b35; --hi:#252c3a;
  --s1:#2f86f6; --s2:#b8842e; --grid:#2a2f39; --axis:#6f7887;
  --pad3:#3b8cff; --pad2:#2a5a99; --pad1:#233247;
  --ok:#34c47c; --ok-bg:#16301f; --warn:#f0a13a; --warn-bg:#3a2a12; --bad:#f06565; --bad-bg:#3d1f1f;
  --shadow:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;font-size:13.5px}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh;background:linear-gradient(90deg,var(--surface) 160px,var(--bg) 160px)}
/* ===== sidebar (réplica) ===== */
aside{width:160px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:0 8px 22px}.logo img{height:36px;width:auto;display:block}
.menu-label{font-size:10px;letter-spacing:.14em;color:var(--soft);padding:0 8px 10px;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:12.5px;line-height:1.25;position:relative}
.nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav:hover{background:var(--surface2)}.nav.active{background:var(--accent-bg);color:var(--accent-ink)}
.nav.active{padding-right:44px}.nav .new{position:absolute;right:6px;top:8px;font-size:8.5px;letter-spacing:.08em;background:var(--accent);color:#fff;padding:2px 5px;border-radius:99px;font-weight:700}
.year{display:flex;align-items:center;gap:6px;padding:4px 8px 8px 30px;font-size:11px;color:var(--muted)}
.year select{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--surface);color:var(--ink)}
.sfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:8px}
.ibtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink2);background:var(--surface)}
.ibtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .dot{position:absolute}
.user{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px;margin-left:2px}
/* ===== main ===== */
main{flex:1;padding:22px 40px 64px;max-width:1300px;min-width:0}
/* banner (Open Finance style) */
.banner{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.banner b{color:var(--ink)}.banner small{color:var(--muted)}
.banner .sp{flex:1}
.banner .link{color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap}.banner .btn{white-space:nowrap}
/* page tabs (Resumo | Análise) */
.ptabs{display:inline-flex;margin-top:16px;background:var(--surface2);border-radius:8px;padding:0}
.ptabs span{padding:9px 20px;font-size:12.5px;font-weight:600;color:var(--accent-ink);cursor:pointer;border-radius:8px}
.ptabs span.on{background:#1c2233;color:#fff}
:root[data-theme="dark"] .ptabs span.on{background:#0f1218}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-top:22px;flex-wrap:wrap}
h1{font-weight:700;font-size:20px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:3px;font-size:12.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.n{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}
/* ===== card ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .hd h3{font-weight:600;font-size:14px}
.card .hd .hint{font-size:11.5px;color:var(--muted)}
/* class tabs inside card (underline like Carteira Consolidada) */
.ctabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ctab{padding:13px 14px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.ctab .n{font-size:10.5px;color:var(--muted);background:var(--surface2);padding:1px 6px;border-radius:99px;font-weight:600}
.ctab.on{color:var(--accent-ink);border-color:var(--accent);font-weight:600}.ctab.on .n{background:var(--accent-bg);color:var(--accent-ink)}
/* toolbar */
.bar{display:flex;align-items:center;gap:8px;padding:14px 18px;flex-wrap:wrap}
.chip{font-weight:500;font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent-bg);border-color:transparent;color:var(--accent-ink);font-weight:600}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.bar .sp{flex:1}.bar .meta{font-size:12px;color:var(--muted)}
.pills{display:inline-flex;gap:4px}
.pill{padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--surface2);cursor:pointer}
.pill.on{background:var(--accent);color:#fff}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:300px;color:var(--soft)}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search input{border:0;outline:0;font:inherit;font-size:12.5px;flex:1;color:var(--ink);background:transparent}
/* ===== tables (cabeçalho navy como no app) ===== */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--thead);color:var(--thead-ink);font-weight:600;font-size:11px;text-align:right;padding:10px 12px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th:first-child{border-radius:6px 0 0 0}.tbl th:last-child{border-radius:0 6px 0 0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--row-hover)}
.tbl .hi td{background:var(--hi);font-weight:600}
.tbl-pad{padding:0 18px 18px}
.tk{display:flex;align-items:center;gap:10px}
.tk .ic{width:32px;height:32px;border-radius:8px;background:var(--accent-bg);color:var(--accent-ink);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.tk b{font-weight:600;font-size:13px;display:block;color:var(--accent-ink)}.tk small{color:var(--muted);font-size:11px}
.streak{display:inline-flex;align-items:center;gap:6px}
.streak i{display:inline-flex;gap:2px}.streak i b{width:4px;height:11px;border-radius:2px;background:var(--line);display:block}.streak i b.on{background:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.score .ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);position:relative}
.score .ring::after{content:attr(data-v);position:absolute;inset:3.5px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:11px}
.port{font-size:12px;color:var(--muted)}.port b{color:var(--ink);font-weight:600}.port.none{color:var(--soft)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
/* ===== comparador ===== */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 6px}
.slot{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.slot .rm{position:absolute;right:8px;top:6px;color:var(--soft);cursor:pointer;font-size:16px;line-height:1}
.slot .sp-price{margin-top:8px;font-weight:600;font-size:13px}
.slot.add{border-style:dashed;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;color:var(--accent-ink);font-weight:600;font-size:12.5px;cursor:pointer;min-height:84px}
.slot.add small{display:flex;gap:6px;font-weight:500;color:var(--muted)}.slot.add em{font-style:normal;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:11px;cursor:pointer}
.tbl.cmp th{text-align:center}.tbl.cmp td{text-align:center}.tbl.cmp td.lbl,.tbl.cmp th:first-child{text-align:left}
.tbl.cmp td.lbl{color:var(--muted);font-weight:500}
.tbl.cmp tr.grp td{background:var(--surface2);color:var(--ink);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;text-align:left}
.tbl.cmp td.best{background:var(--ok-bg);font-weight:600}
.tbl.cmp .star{display:block;font-size:10px;color:var(--ok);font-weight:600;margin-top:2px}
.tbl.cmp tr.tot td{border-top:2px solid var(--line);padding:12px}
.tbl.cmp .tk{justify-content:center}
.csem{display:inline-flex;align-items:center;gap:10px}.csem .dots{display:inline-flex;gap:4px}.csem .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cs-l{font-size:11px;color:var(--muted);margin-top:4px}
.mini.m4{grid-template-columns:repeat(4,1fr)}
.verdict{margin:0 18px 18px;padding:16px 18px;border-radius:12px;background:var(--tint-blue);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.verdict .e{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.verdict b{font-size:14px}.verdict p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;max-width:70ch}
@media(max-width:1180px){.slots{grid-template-columns:repeat(2,1fr)}.mini.m4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.slots{grid-template-columns:1fr}.mini.m4{grid-template-columns:1fr}}
.mix{margin:12px 18px 0;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:12.5px;line-height:1.5;border-left:3px solid var(--warn)}
.pad{display:inline-flex;flex-direction:column;gap:5px;align-items:center;min-width:150px}.pad span{font-size:11.5px;color:var(--muted)}.pad span b{color:var(--ink)}
.pbar{display:flex;width:150px;height:8px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line)}.pbar i{display:block;height:100%}
/* ===== comunidade / ranking ===== */
.st5{color:#f2b01e;font-size:13px;letter-spacing:1px;white-space:nowrap}.st5 i{font-style:normal;color:var(--line)}
.cvc{display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}.cvc b{font-size:12.5px}.cvc small{font-size:10.5px;color:var(--muted)}
.rk-head{display:flex;justify-content:space-between;gap:20px;padding:16px 18px 0;flex-wrap:wrap;align-items:flex-start}
.rk-head h3{font-weight:600;font-size:15px}.rk-head p{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:60ch}
.rk-how{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:380px;font-size:11.5px;color:var(--muted);line-height:1.45}.rk-how b{display:block;color:var(--ink);font-size:12px;margin-bottom:2px}
.rk-cta{margin:14px 18px 0;padding:12px 16px;border-radius:10px;background:var(--tint-blue);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;flex-wrap:wrap}.rk-cta em{font-style:normal;color:var(--muted)}
.tbl.rk td{text-align:left}.tbl.rk th{text-align:left}
.mv{font-size:10.5px;font-weight:600;color:var(--soft);margin-left:4px}.mv.up{color:var(--ok)}.mv.dn{color:var(--bad)}
.hbar{width:90px;height:6px;border-radius:99px;background:var(--line);display:inline-block;vertical-align:middle;margin-right:6px}.hbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.vote{display:inline-flex;gap:1px;cursor:pointer}.vote i{font-style:normal;font-size:16px;color:var(--line);transition:color .1s}.vote i.on{color:#f2b01e}.vote:hover i{color:#f2b01e}.vote i:hover~i{color:var(--line)}
.vote.big i{font-size:24px}
.voted{display:block;font-size:10.5px;color:var(--muted)}
.myvote{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px}
.myvote .q{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}.myvote .chip.sm{padding:3px 9px;font-size:11.5px;font-style:normal}.myvote small{flex-basis:100%;color:var(--muted);font-size:11px}
.tbl th.sortable{cursor:pointer;user-select:none}.tbl th.sortable:hover{text-decoration:underline}.tbl th.sortable.on{color:#fff;background:var(--accent)}
.qf-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:6px 0 4px}.qf-meta b{color:var(--ink)}
.qf-title{font-weight:600;font-size:13.5px;margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--accent)}
.tbl.qf th{text-align:right;padding:8px 10px;font-size:11px}.tbl.qf th:first-child{text-align:left;min-width:190px}
.tbl.qf td{padding:7px 10px;font-size:12.5px;text-align:right}.tbl.qf td.lbl{text-align:left;font-weight:500;color:var(--ink2);position:sticky;left:0;background:var(--surface)}
.tbl.qf tr.ratio td{color:var(--muted);background:var(--surface2)}.tbl.qf tr.ratio td.lbl{background:var(--surface2);font-weight:400;font-style:italic}
.tbl.qf tbody tr{cursor:default}.tbl.qf tbody tr:hover td{background:var(--row-hover)}
.l10{display:inline-flex;align-items:flex-end;gap:2px;height:16px}.l10 b{display:block;width:5px;border-radius:1.5px;background:var(--ok)}.l10 b.n{background:var(--bad)}
.more{display:flex;justify-content:center;padding:14px 0 4px}.more .btn{font-size:12.5px}
thead th{position:sticky;top:0;z-index:1}
/* ===== detail ===== */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;padding:14px 18px 0}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dhead{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:12px 18px 18px;flex-wrap:wrap}
.dhead .id{display:flex;gap:14px;align-items:center}
.dhead .big{width:52px;height:52px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.dhead h2{font-weight:700;font-size:20px;line-height:1.1}
.dhead .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:500;color:var(--ink2);background:var(--surface2);padding:3px 8px;border-radius:6px}
.price{text-align:right}.price b{font-weight:700;font-size:24px;display:block;line-height:1}.price span{font-size:12px}
.grid{display:grid;gap:16px;margin-top:16px}
.g-2{grid-template-columns:1fr 1fr}.g-13{grid-template-columns:1fr 2fr}.g-14{grid-template-columns:minmax(250px,1fr) 3fr}
.grid>*{min-width:0}
/* semáforo */
.sem{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.sem .total{text-align:center;padding-right:20px;border-right:1px solid var(--line);min-width:150px}
.sem .total .v{font-weight:700;font-size:40px;line-height:1}
.sem .total small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.sem .total .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.chk{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.chk b{font-weight:600;font-size:13px}.chk p{font-size:12px;color:var(--muted);line-height:1.4}
.chk .badge svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
/* quote-style cards (como os cards IBOV/Dólar/Bitcoin) */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.q{border-radius:10px;padding:14px 16px;background:var(--tint-gray)}
.q.b{background:var(--tint-blue)}.q.b2{background:var(--tint-blue2)}
.q .l{font-size:11px;color:var(--muted);font-weight:500}
.q .v{font-weight:700;font-size:18px;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.q .s{font-size:11px;color:var(--muted);margin-top:5px}
.q .s.pos{color:var(--ok)}.q .s.neg{color:var(--bad)}
/* chart */
.ch{padding:14px 18px 8px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:12px;padding:8px 11px;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.18);display:none;z-index:50;line-height:1.5}
.yt td:first-child{font-weight:600}
.mini{display:grid;grid-template-columns:1fr;gap:12px;padding:16px 18px}
.mini .m{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}.mini .m svg{max-width:100%}
.mini .m .l{font-size:11px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.mini .m .l b{color:var(--ink);font-size:13px}
/* community */
.comm{padding:16px 18px}
.stars{display:flex;align-items:center;gap:12px}
.stars .n{font-weight:700;font-size:30px;line-height:1}
.stars .s{color:#f2b01e;font-size:16px;letter-spacing:2px}
.stars small{color:var(--muted);font-size:12px}
.tese{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.tese .who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.tese .who i{width:20px;height:20px;border-radius:50%;background:var(--accent-bg);display:inline-block}
.tese p{font-size:13px;line-height:1.55}
.tese .up{margin-top:8px;font-size:11.5px;color:var(--accent-ink);font-weight:500}
.risks{margin-top:4px}.risks li{list-style:none;display:flex;gap:8px;font-size:12.5px;padding:5px 0}
.risks li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);margin-top:6px;flex-shrink:0}
.mine textarea{width:100%;min-height:88px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:12.5px;color:var(--ink);resize:vertical;background:var(--surface)}
.mine .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
/* events */
.ev{list-style:none;padding:6px 18px 14px}.ev li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center}
.ev li:last-child{border:0}
.ev .d{width:42px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-weight:700;font-size:13px;line-height:1;background:var(--surface2)}
.ev .d small{display:block;font-size:9px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ev b{font-weight:600;font-size:12.5px;display:block}.ev span{font-size:11.5px;color:var(--muted)}
.edu{margin-top:16px;padding:16px 18px;border-radius:12px;background:linear-gradient(118deg,#1c2a44,#2b3a55 60%,#396caa);color:#fff}
.edu .e{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8fc0f7;font-weight:600}
.edu h4{font-weight:700;font-size:15px;margin-top:5px}.edu p{font-size:12px;color:rgba(255,255,255,.78);margin-top:5px;line-height:1.5}
.note{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center;padding:0 18px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--soft);display:flex;justify-content:space-between}
footer.legal{display:block;font-size:11.5px;line-height:1.55;color:var(--muted);max-width:110ch}footer.legal b{color:var(--ink)}
@media(max-width:1180px){.checks{grid-template-columns:repeat(3,1fr)}.g-2,.g-13,.g-14{grid-template-columns:1fr}}
@media(max-width:760px){aside{display:none}.app{background:var(--bg)}main{padding:16px 14px 48px}.kpis{grid-template-columns:1fr 1fr}.checks{grid-template-columns:1fr 1fr}.sem{grid-template-columns:1fr}.sem .total{border:0;padding:0}.search{min-width:0;width:100%}}

/* ---------- Valuation ---------- */
.hsub{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.vbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 0}
.vbar .chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.vsum{font-size:12px;color:var(--muted)}.vsum b{color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 18px}
.vc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:flex;flex-direction:column}
.vc .l{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.vc .l .i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);color:var(--soft);font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:default}
.vc .v{font-weight:700;font-size:22px;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.vc p{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.4;flex:1}
.rng{position:relative;height:6px;border-radius:99px;background:var(--surface2);margin-top:12px;border:1px solid var(--line)}
.rng .avg{position:absolute;top:-4px;width:2px;height:12px;background:var(--muted);border-radius:2px;transform:translateX(-50%)}
.rng .cur{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translateX(-50%);box-shadow:0 0 0 1px var(--accent)}
.rng-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-top:7px;font-variant-numeric:tabular-nums}
.vc-st{font-size:11.5px;font-weight:600;color:var(--ink2);margin-top:6px}
.vc-ref{font-size:11px;color:var(--soft);margin-top:4px}
.sim{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;padding:14px 18px 18px}.sim>div{min-width:0}
.tbl.sim-t td.lbl small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35}
.rbs{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rbs-h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:8px}.rbs-h span:first-child{font-weight:600;color:var(--ink2)}
.rbs-h .pxl{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:middle;margin-right:6px}
.rb{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.rb-l{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rb-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rb-t{position:relative;height:14px;background:var(--surface2);border-radius:4px}.rb-t i{display:block;height:100%;background:var(--accent);opacity:.8;border-radius:4px}
.rb-t em{position:absolute;top:-3px;width:2px;height:20px;background:var(--ink);transform:translateX(-50%)}
@media(max-width:760px){.rb{grid-template-columns:1fr}.rb-v{text-align:left}}
.sim .inp{border:1px solid var(--line);border-radius:12px;padding:6px 14px 12px;background:var(--surface2)}
.sim .inp h4{font-size:12.5px;font-weight:600;margin:12px 0 4px}.sim .inp h4 small{font-weight:400;color:var(--muted);font-size:11px}
.sim label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink2);padding:6px 0;border-bottom:1px dashed var(--line)}
.sim label .in{display:inline-flex;align-items:center;gap:6px}.sim label .in em{font-style:normal;font-size:11px;color:var(--muted);min-width:38px}
.sim input[type=number]{width:84px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;text-align:right;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.sim input[type=number]:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.sim label.rg{flex-direction:column;align-items:stretch;gap:8px;border:0;padding-top:12px}.sim label.rg b{color:var(--ink)}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.sim-foot{display:flex;justify-content:flex-end;font-size:11.5px;margin-top:4px}.sim-foot .link{color:var(--accent-ink);cursor:pointer}
.tbl.sim-t td,.tbl.sim-t th{white-space:normal;vertical-align:middle}.tbl.sim-t td.lbl{max-width:300px;min-width:200px}.tbl.sim-t td.mono{max-width:220px}.tbl.sim-t td:nth-child(n+3){white-space:nowrap}.tbl.sim-t td.lbl{color:var(--ink)}.tbl.sim-t td.mono{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.sim-goal{display:grid;grid-template-columns:2fr 1fr 2fr;gap:12px;margin-top:12px;background:var(--tint-blue);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--ink2)}
.sim-goal .e{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}.sim-goal b{color:var(--ink);font-size:14px}
.sim-mine{margin-top:12px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap;gap:4px}.sim-mine b{color:var(--ink)}
@media(max-width:1180px){.vgrid{grid-template-columns:repeat(2,1fr)}.sim{grid-template-columns:1fr}}
@media(max-width:760px){.vgrid{grid-template-columns:1fr}.sim-goal{grid-template-columns:1fr}}
</style></head>

<script>
// ===== App: Análise de Ativos (protótipo navegável, componentes do My Finance) =====
const S = { qf:'simples', sortCol:null, sortDir:-1, pg:1, perPage:25, sort:'mf', myvote:{}, page:'quadro', cls:'acoes', view:'list', sel:{}, filters:{streak:false,dy:false,port:false}, mode:'simples', range:'10A' };
const $ = (s,el=document)=>el.querySelector(s);
const main = $('#main'), tip = $('#tip');
const CHK = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>';
const WRN = '<svg viewBox="0 0 24 24"><path d="M12 6v7M12 17v.5"/></svg>';
const BAD = '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>';
const fmtN = (v,d=1)=> v==null?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sc = v => v>=8?'var(--ok)':v>=6?'var(--accent)':v>=4?'var(--warn)':'var(--bad)';
const stars = r => { const f=Math.round(r); return `<span class="st5">${'★'.repeat(f)}<i>${'★'.repeat(5-f)}</i></span>`; };
const bayes = (r,n,m=200,C=4.1) => (n/(n+m))*r + (m/(n+m))*C;   // média ponderada pelo nº de votos (IMDb)
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- tema ----------
const root=document.documentElement;
function setTheme(t){ root.setAttribute('data-theme',t); $('#ico-moon').style.display=t==='dark'?'none':''; $('#ico-sun').style.display=t==='dark'?'':'none'; render(); }
$('#theme').addEventListener('click',()=>setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
if(matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme','dark');

// ---------- lista ----------
function cell(col,r,cur){
  const v=r[col.k];
  switch(col.t){
    case 'money': return v==null?'—':cur+' '+fmtN(v,2);
    case 'pct': return v==null?'—':`<span class="${v<0?'neg':''}">${fmtN(v,1)}%</span>`;
    case 'num': return v==null?'—':fmtN(v,(col.k==='pvp'&&v<2)?2:1)+(col.k==='div'&&S.cls!=='stocks'?'×':'');
    case 'int': return v==null?'—':v;
    case 'pad': { if(!v) return '—'; return `<div class="pad"><div class="pbar"><i style="width:${v.aaa}%;background:var(--pad3)"></i><i style="width:${v.aa}%;background:var(--pad2)"></i><i style="width:${v.a}%;background:var(--pad1)"></i></div><span><b>AAA ${v.aaa}%</b> · AA ${v.aa}% · A/B ${v.a}%</span></div>`; }
    case 'txt': return v??'—';
    case 'streak': { const n=Math.max(0,Math.min(10,v||0)); return `<span class="streak"><i>${Array.from({length:10},(_,i)=>`<b class="${i<n?'on':''}"></b>`).join('')}</i>${n}${n>=10?'+':''} ${n===1?'ano':'anos'}</span>`; }
    case 'lucro10': { const L=r.lucros||[]; return `<span class="l10" title="Lucro por ano ${YEARS[0]}–${YEARS[9]}">${L.map((v,i)=>`<b class="${v>0?'p':'n'}" style="height:${Math.max(3,Math.min(14,Math.abs(v)*3))}px" title="${YEARS[i]}: ${v>0?'+':''}${fmtN(v,2)}"></b>`).join('')}</span>`; }
    case 'cv': return r.cv?`<span class="cvc">${stars(r.cv.r)}<b>${fmtN(r.cv.r,1)}</b><small>${r.cv.n.toLocaleString('pt-BR')} votos</small></span>`:'—';
    case 'score': return `<span class="score"><span class="ring" style="--v:${v*10};--c:${sc(v)}" data-v="${fmtN(v,1)}"></span></span>`;
    case 'port': return r.port?`<span class="port"><b>${r.port.q}</b> ${S.cls==='fiis'?'cotas':'ações'} · <b>${fmtN(r.port.p,1)}%</b></span>`:'<span class="port none">—</span>';
    default: return `<span class="tk"><span class="ic">${r.t.slice(0,4)}</span><span><b>${r.t}</b><small>${r.n}</small></span></span>`;
  }
}
const SIMPLE={acoes:['ativo','preco','streak','roe','pl','pvp','dy','score','cv','port'],fiis:['ativo','tipo','preco','dy','pvp','vac','score','cv','port'],stocks:['ativo','preco','streak','roe','pl','dy','score','cv','port'],reits:['ativo','preco','pffo','pay','occ','dy','score','cv','port']};
const CVCOL={k:'cv',l:'Comunidade',t:'cv'};
const L10COL={k:'lucro10',l:'Lucro 10 anos',t:'lucro10'};

function renderList(){
  const D=DATA[S.cls];
  let rows=D.rows.slice();
  if(S.filters.streak) rows=rows.filter(r=>(r.streak??10)>=5);
  if(S.filters.dy) rows=rows.filter(r=>(r.dy||0)>=4);
  if(S.filters.port) rows=rows.filter(r=>r.port);
  if(S.sortCol){ const k=S.sortCol; const val=r=>k==='cv'?bayes(r.cv.r,r.cv.n):k==='port'?(r.port?r.port.p:-1):k==='lucro10'?(r.lucros||[]).filter(v=>v>0).length:k==='ativo'?r.t:(typeof r[k]==='string'?parseFloat(r[k].replace(/[^\d,.-]/g,'').replace(',','.'))||r[k]:r[k]);
    rows.sort((a,b)=>{const x=val(a),y=val(b); if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*S.sortDir;}); }
  else rows.sort(S.sort==='cv'?(a,b)=>bayes(b.cv.r,b.cv.n)-bayes(a.cv.r,a.cv.n):(a,b)=>b.score-a.score);
  const total=rows.length; rows=rows.slice(0,S.pg*S.perPage);
  const allCols=[...D.cols.slice(0,-1),CVCOL,D.cols[D.cols.length-1]];
  const streakIdx=allCols.findIndex(c=>c.k==='streak'); if(streakIdx>=0) allCols.splice(streakIdx+1,0,L10COL); else allCols.splice(2,0,L10COL);
  const cols=S.mode==='simples'?allCols.filter(c=>SIMPLE[S.cls].includes(c.k)):allCols;
  return `
  <div class="bar">
    <span class="chip ${S.filters.streak?'on':''}" data-f="streak">${CHK}Lucro consistente (5+ anos)</span>
    <span class="chip ${S.filters.dy?'on':''}" data-f="dy">${CHK}Dividendos ≥ 4%</span>
    <span class="chip ${S.filters.port?'on':''}" data-f="port">${CHK}Na minha carteira</span>
    <span class="chip">Setor ▾</span><span class="chip">Mais filtros ▾</span>
    <span class="sp"></span>
    <span class="meta">${total} de ${D.count.toLocaleString('pt-BR')} · ordenar por</span><span class="pills"><span class="pill ${S.sort!=='cv'?'on':''}" data-s="mf">Índice MF</span><span class="pill ${S.sort==='cv'?'on':''}" data-s="cv">Comunidade</span></span>
    <span class="pills"><span class="pill ${S.mode==='simples'?'on':''}" data-m="simples">Resumo</span><span class="pill ${S.mode==='completo'?'on':''}" data-m="completo">Detalhado</span></span>
  </div>
  <div class="tbl-pad"><div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="sortable ${S.sortCol===c.k?'on':''}" data-sort="${c.k}">${c.l}${S.sortCol===c.k?(S.sortDir<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-t="${r.t}">${cols.map(c=>`<td>${cell(c,r,D.cur)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${rows.length<total?`<div class="more"><span class="btn" data-more="1">Mostrar mais ${Math.min(S.perPage,total-rows.length)} de ${total-rows.length} restantes</span></div>`:`<div class="more"><span class="meta">${total} ativos exibidos${S.sortCol?' · ordenado por '+(cols.find(c=>c.k===S.sortCol)||{}).l:''}</span></div>`}
  <p class="note">Índice MF: indicador quantitativo calculado por fórmula pública — consistência de lucros (35%) · endividamento (20%) · rentabilidade (20%) · dividendos (15%) · preço vs. histórico (10%). Não é análise nem recomendação de investimento.</p></div>`;
}

// ---------- gráficos (SVG, cores via tokens do tema) ----------
function lineChart(id,years,series,opt={}){
  const W=720,H=250,pl=44,pr=16,pt=14,pb=30;
  const all=series.flatMap(s=>s.vals); const min=opt.fixMin??Math.min(...all,opt.base??Infinity), max=opt.fixMax??Math.max(...all);
  const y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1)); const x=i=>pl+(W-pl-pr)*i/(years.length-1);
  const ticks=5, grid=Array.from({length:ticks+1},(_,i)=>min+(max-min)*i/ticks);
  let g=grid.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--axis)">${Math.round(v)}</text>`).join('');
  if(opt.base!=null) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(opt.base)}" y2="${y(opt.base)}" stroke="var(--axis)" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
  if(opt.avg!=null) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(opt.avg)}" y2="${y(opt.avg)}" stroke="var(--s2)" stroke-dasharray="4 3"/><text x="${W-pr}" y="${y(opt.avg)-5}" text-anchor="end" font-size="11" fill="var(--s2)">média ${fmtN(opt.avg,1)}</text>`;
  const xs=years.map((yr,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--axis)">${yr}</text>`).join('');
  const paths=series.map((s,si)=>{const d=s.vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(''); const last=s.vals.length-1;
    const area = (opt.area&&si===0)?`<path d="${d}L${x(last)},${H-pb}L${x(0)},${H-pb}Z" fill="${s.c}" fill-opacity=".10"/>`:'';
    return `${area}<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(s.vals[last])}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>

function barChart(id,years,vals,c,cur){
  const W=720,H=220,pl=44,pr=16,pt=18,pb=30; const max=Math.max(...vals)*1.15;
  const bw=(W-pl-pr)/years.length; const y=v=>pt+(H-pt-pb)*(1-v/max);
  const grid=[0,.25,.5,.75,1].map(f=>{const v=max*f;return `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--axis)">${fmtN(v,2)}</text>`}).join('');
  const bars=vals.map((v,i)=>{const x=pl+bw*i+bw*.22,w=bw*.56,h=H-pb-y(v);
    const lab=(i===vals.length-1||i===0)?`<text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">${fmtN(v,2)}</text>`:'';
    return `<g class="hit" data-i="${i}"><rect x="${x}" y="${y(v)}" width="${w}" height="${h}" rx="4" fill="${c}"/><rect x="${x}" y="${H-pb-3}" width="${w}" height="3" fill="${c}"/>${lab}<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--axis)">${years[i]}</text></g>`;}).join('');
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" data-years='${JSON.stringify(years)}' data-series='${JSON.stringify([{n:cur,v:vals,c}])}' data-dec="2">${grid}${bars}</svg>`;
}

function checksFor(cls,r){
  const t=COMPARE[cls].thr;
  if(cls==='acoes'||cls==='stocks') return [
    {b:'Lucros consecutivos',s:(r.streak??0)>=t.streak?'ok':(r.streak??0)>=2?'warn':'bad'},
    {b:'Endividamento',s:r.div==null?'ok':r.div<=t.div?'ok':r.div<=t.div*2?'warn':'bad'},
    {b:'Rentabilidade (ROE)',s:(r.roe??-1)>=t.roe?'ok':(r.roe??-1)>=8?'warn':'bad'},
    {b:'Preço vs. histórico',s:r.pl==null?'bad':r.pl<=t.pl?'ok':r.pl<=t.pl*2.2?'warn':'bad'},
    {b:'Dividendos',s:(r.dy??0)>=t.dy?'ok':(r.dy??0)>=1?'warn':'bad'}];
  if(cls==='fiis'&&r.tipo==='Papel') return [
    {b:'Renda recorrente',s:(r.dy??0)>=10?'ok':(r.dy??0)>=8?'warn':'bad'},
    {b:'Inadimplência',s:r.inad<=1?'ok':r.inad<=4?'warn':'bad'},
    {b:'LTV',s:r.ltv<=55?'ok':r.ltv<=65?'warn':'bad'},
    {b:'Preço vs. histórico',s:r.pvp>=0.9&&r.pvp<=1.05?'ok':r.pvp>=0.8&&r.pvp<=1.15?'warn':'bad'},
    {b:'Diversificação',s:(r.ncri??0)>=40?'ok':(r.ncri??0)>=20?'warn':'bad'}];
  if(cls==='fiis') return [
    {b:'Renda recorrente',s:(r.dy??0)>=t.dy?'ok':(r.dy??0)>=6?'warn':'bad'},
    {b:'Vacância',s:r.vac==null?'ok':r.vac<=5?'ok':r.vac<=t.vac?'warn':'bad'},
    {b:'Diversificação',s:(r.imov??0)>=15?'ok':(r.imov??0)>=8?'warn':'bad'},
    {b:'Padrão construtivo',s:!r.pad?'warn':(r.pad.aaa+r.pad.aa)>=80?'ok':(r.pad.aaa+r.pad.aa)>=55?'warn':'bad'},
    {b:'Preço vs. histórico',s:r.pvp<=t.pvp?'ok':r.pvp<=1.2?'warn':'bad'}];
  return [
    {b:'FFO por ação',s:(r.streak??0)>=t.streak?'ok':(r.streak??0)>=2?'warn':'bad'},
    {b:'FFO payout',s:r.pay<=t.pay?'ok':r.pay<=95?'warn':'bad'},

    {b:'Endividamento',s:r.div<=t.div?'ok':r.div<=7.5?'warn':'bad'},
    {b:'Dividendos',s:(r.dy??0)>=t.dy?'ok':(r.dy??0)>=2?'warn':'bad'}];
}

  if(t.dataset.cls){S.cls=t.dataset.cls;S.view='list';S.pg=1;S.sortCol=null;}

function fmtV(v,f,cur){ if(v==null) return '—'; if(f==='s') return v; if(f==='%') return fmtN(v,1)+'%'; if(f==='x') return fmtN(v,1); if(f==='x2') return fmtN(v,2); if(f==='c') return cur+' '+fmtN(v,2); if(f==='n1') return fmtN(v,1); return fmtN(v,0); }
function simVals(cls){ return Object.assign({}, VAL[cls].sim, S.sim[cls]||{}); }
function rangeBar(it,cur){
  if(!it.h) return `<div class="vc-ref">${it.ref||''}</div>`;
  const h=it.h, mn=Math.min(...h), mx=Math.max(...h), avg=h.reduce((a,b)=>a+b,0)/h.length, v=it.v;
  const pos=x=>Math.max(2,Math.min(98,(x-mn)/((mx-mn)||1)*100));
  let st; const d=v-avg;
  if(it.f==='%') st=Math.abs(d)<0.15?'na média de 10 anos':(d>0?'+':'−')+fmtN(Math.abs(d),1)+' p.p. vs. média 10a';
  else if(Math.abs(avg)<0.5) st=Math.abs(d)<0.05?'na média de 10 anos':d>0?'acima da média 10a':'abaixo da média 10a';
  else { const p=(v/avg-1)*100; st=Math.abs(p)<3?'na média de 10 anos':(p>0?'+':'−')+fmtN(Math.abs(p),0)+'% vs. média 10a'; }
  if(v>=mx) st+=' · maior em 10 anos'; else if(v<=mn) st+=' · menor em 10 anos';
  return `<div class="rng"><i class="avg" style="left:${pos(avg)}%" title="média 10a"></i><b class="cur" style="left:${pos(v)}%"></b></div>
  <div class="rng-l"><span>mín ${fmtV(mn,it.f,cur)}</span><span>média ${fmtV(avg,it.f,cur)}</span><span>máx ${fmtV(mx,it.f,cur)}</span></div>
  <div class="vc-st">${st}</div>${it.ref?`<div class="vc-ref">${it.ref}</div>`:''}`;
}

  const sum=withH.length?`<b>${below} de ${withH.length}</b> indicadores de "${g.t}" estão abaixo da própria média de 10 anos · marcador azul = valor atual · traço = média`:'Indicadores sem histórico anual — valores dos últimos 12 meses';

}
function simRows(cls,p,price,cur){
  const R=[]; const pct=x=>{const d=(x/price-1)*100; return (d>=0?'+':'−')+fmtN(Math.abs(d),0)+'%'};
  const EX={bazin:'Preço em que o provento atual entregaria o yield que você deseja.',graham:'Fórmula clássica (1949) para lucros estáveis: dá o mesmo peso a lucro e patrimônio.',mult:'Quanto valeria o ativo se negociasse ao múltiplo que você escolheu.',gordon:'Valor presente de proventos crescendo a g, descontados a k. Muito sensível às premissas.',dyfii:'Preço em que o rendimento dos últimos 12 meses entregaria o yield que você deseja.',pvp:'Cotação equivalente ao P/VP que você escolheu sobre o valor patrimonial.'};
  const row=(m,prem,res,ex)=>R.push({m,prem,res,ex:EX[ex]||'',pct:res?pct(res):'—',ent:res?res*(1-p.mg/100):null});
  if(cls==='acoes'||cls==='stocks'){
    row('Preço pelo dividendo (Bazin)',`${cur} ${fmtN(p.dpa,2)} ÷ ${fmtN(p.dy,1)}%`,p.dy>0?p.dpa/(p.dy/100):null,'bazin');
    row('Fórmula de Graham',`√(22,5 × ${fmtN(p.lpa,2)} × ${fmtN(p.vpa,2)})`,p.lpa>0&&p.vpa>0?Math.sqrt(22.5*p.lpa*p.vpa):null,'graham');
    row(`Múltiplo alvo (${p.plLabel})`,`${fmtN(p.pl,1)} × ${cur} ${fmtN(p.lpa,2)}`,p.pl*p.lpa,'mult');
    row('Dividendos crescentes (Gordon)',`${fmtN(p.dpa,2)} × (1+${fmtN(p.g,1)}%) ÷ (${fmtN(p.k,1)}% − ${fmtN(p.g,1)}%)`,p.k>p.g?p.dpa*(1+p.g/100)/((p.k-p.g)/100):null,'gordon');
  } else if(cls==='fiis'){
    row('Preço pela renda desejada',`${cur} ${fmtN(p.rend,2)} ÷ ${fmtN(p.dy,1)}%`,p.dy>0?p.rend/(p.dy/100):null,'dyfii');
    row('P/VP alvo',`${fmtN(p.pvpAlvo,2)} × ${cur} ${fmtN(p.vp,2)}`,p.pvpAlvo*p.vp,'pvp');
  } else {
    row('Múltiplo alvo (P/FFO)',`${fmtN(p.pffo,1)} × ${cur} ${fmtN(p.ffo,2)}`,p.pffo*p.ffo,'mult');
    row('Preço pelo dividendo (Bazin)',`${cur} ${fmtN(p.dpa,2)} ÷ ${fmtN(p.dy,1)}%`,p.dy>0?p.dpa/(p.dy/100):null,'bazin');
    row('Dividendos crescentes (Gordon)',`${fmtN(p.dpa,2)} × (1+${fmtN(p.g,1)}%) ÷ (${fmtN(p.k,1)}% − ${fmtN(p.g,1)}%)`,p.k>p.g?p.dpa*(1+p.g/100)/((p.k-p.g)/100):null,'gordon');
  }
  return R;
}
function simResults(cls){
  const V=VAL[cls], cur=V.cur, d=DATA[cls].detail, price=d.preco, p=simVals(cls), rows=simRows(cls,p,price,cur), per=p.per;
  const tbl=`<div class="tbl-wrap"><table class="tbl sim-t"><thead><tr><th>Método</th><th>Suas premissas</th><th>Resultado</th><th>vs. cotação (${cur} ${fmtN(price,2)})</th><th>Com sua margem de ${fmtN(p.mg,0)}%</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="lbl"><b>${r.m}</b><small>${r.ex}</small></td><td class="mono">${r.prem}</td><td><b>${r.res?cur+' '+fmtN(r.res,2):'—'}</b></td><td>${r.pct}</td><td>${r.ent?cur+' '+fmtN(r.ent,2):'—'}</td></tr>`).join('')}
  </tbody></table></div>`;
  const mx=Math.max(price,...rows.map(r=>r.res||0))*1.12; const px=x=>x/mx*100;
  const bars=`<div class="rbs"><div class="rbs-h"><span>Resultados lado a lado</span><span><i class="pxl"></i> cotação atual ${cur} ${fmtN(price,2)}</span></div>${rows.map(r=>`<div class="rb"><span class="rb-l">${r.m.replace(/ \(.*\)/,'')}</span><div class="rb-t"><i style="width:${r.res?px(r.res):0}%"></i><em style="left:${px(price)}%"></em></div><span class="rb-v">${r.res?cur+' '+fmtN(r.res,2):'—'}</span></div>`).join('')}</div>`;
  let extra=bars;
  if(cls==='fiis'){ const cotas=Math.ceil(p.renda*12/p.rend), custo=cotas*price, falta=Math.max(0,cotas-d.port.q);
    extra+=`<div class="sim-goal"><div><div class="e">Meta de renda</div><b>${cotas.toLocaleString('pt-BR')} cotas</b> para receber ${cur} ${fmtN(p.renda,0)}/mês com o rendimento atual (${cur} ${fmtN(p.rend/12,2)}/cota/mês)</div><div><div class="e">Custo à cotação de hoje</div><b>${cur} ${fmtN(custo,0)}</b></div><div><div class="e">Você já tem</div><b>${d.port.q} cotas</b> · faltam ${falta.toLocaleString('pt-BR')} (${cur} ${fmtN(falta*price,0)}) · esta meta pode virar um objetivo no Planejamento</div></div>`; }
  // posição do usuário
  const pm=d.port.pm; let mine;
  if(cls==='fiis') mine=`Seu preço médio <b>${cur} ${fmtN(pm,2)}</b> equivale a P/VP <b>${fmtN(pm/p.vp,2)}</b> e rendimento sobre custo de <b>${fmtN(p.rend/pm*100,1)}%</b> a.a.`;
  else if(cls==='reits') mine=`Seu preço médio <b>${cur} ${fmtN(pm,2)}</b> equivale a P/FFO <b>${fmtN(pm/p.ffo,1)}</b> e yield sobre custo de <b>${fmtN(p.dpa/pm*100,1)}%</b>.`;
  else mine=`Seu preço médio <b>${cur} ${fmtN(pm,2)}</b> equivale a ${p.plLabel.replace(' alvo','')} <b>${fmtN(pm/p.lpa,1)}</b> e yield sobre custo de <b>${fmtN(p.dpa/pm*100,1)}%</b>.`;
  return `${tbl}${extra}<div class="sim-mine">${mine} <span class="btn sm" style="margin-left:8px">Salvar cenário</span></div>
  <p class="note" style="padding:0;text-align:left;margin-top:10px">Os cenários usam <b>as premissas que você definiu</b>. O My Finance não calcula "preço justo" nem preço-alvo: o resultado é uma conta com os seus parâmetros, serve para estudo e não constitui recomendação de compra ou venda.</p>`;
}
function renderSim(cls){
  const V=VAL[cls], cur=V.cur, p=simVals(cls);
  const inp=(k,l,step,suf)=>`<label><span>${l}</span><span class="in"><input type="number" step="${step}" data-si="${k}" value="${p[k]}">${suf?`<em>${suf}</em>`:''}</span></label>`;
  let fields='';
  if(cls==='acoes'||cls==='stocks') fields=`<h4>Dados do ativo <small>(últimos 12 meses — você pode ajustar)</small></h4>${inp('lpa',cls==='stocks'?'EPS':'LPA','0.01',cur)}${inp('vpa',cls==='stocks'?'Book value/share':'VPA','0.01',cur)}${inp('dpa','Dividendo por ação','0.01',cur)}
    <h4>Suas premissas</h4>${inp('dy','Yield que você deseja','0.5','%')}${inp('pl',p.plLabel+' (média 10a: '+fmtN(V.sim.pl,1)+')','0.5','×')}${inp('g','Crescimento dos dividendos (g)','0.5','% a.a.')}${inp('k','Retorno que você exige (k)','0.5','% a.a.')}`;
  else if(cls==='fiis') fields=`<h4>Dados do fundo <small>(últimos 12 meses)</small></h4>${inp('rend','Rendimento/cota 12m','0.01',cur)}${inp('vp','VP/cota','0.01',cur)}
    <h4>Suas premissas</h4>${inp('dy','Yield que você deseja','0.5','%')}${inp('pvpAlvo','P/VP alvo','0.05','×')}${inp('renda','Renda mensal desejada','100',cur+'/mês')}`;
  else fields=`<h4>Dados do REIT <small>(últimos 12 meses)</small></h4>${inp('ffo','FFO/share','0.01',cur)}${inp('dpa','Dividend/share','0.01',cur)}
    <h4>Suas premissas</h4>${inp('pffo','P/FFO alvo (média 10a: '+fmtN(V.sim.pffo,1)+')','0.5','×')}${inp('dy','Yield que você deseja','0.5','%')}${inp('g','Crescimento do dividendo (g)','0.5','% a.a.')}${inp('k','Retorno que você exige (k)','0.5','% a.a.')}`;
  fields+=`<label class="rg"><span>Margem que você exige <b id="mgv">${fmtN(p.mg,0)}%</b></span><input type="range" min="0" max="50" step="5" data-si="mg" value="${p.mg}"></label>
    <div class="sim-foot"><span class="link" data-sireset>Restaurar valores do ativo</span></div>`;
  return `<div class="sim"><div class="inp">${fields}</div><div class="res" id="simres">${simResults(cls)}</div></div>`;
}
function renderVal(cls){
  return `<div class="card" style="margin-top:16px"><div class="hd"><h3>Valuation <span class="hsub">preço vs. fundamentos</span></h3><span class="pills"><span class="pill ${S.vt==='mult'?'on':''}" data-vt="mult">Múltiplos</span><span class="pill ${S.vt==='cen'?'on':''}" data-vt="cen">Meus cenários</span></span></div>
    ${S.vt==='mult'?renderMult(cls):renderSim(cls)}</div>`;
}
main.addEventListener('click',e=>{
  const t=e.target.closest('[data-vt],[data-vg],[data-sireset]'); if(!t) return;
  if(t.dataset.vt){S.vt=t.dataset.vt;} else if(t.dataset.vg){S.vg=t.dataset.vg;} else {S.sim[S.cls]={};}
  render();
});
main.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.si) return;
  S.sim[S.cls]=S.sim[S.cls]||{}; const v=parseFloat(t.value); if(!isNaN(v)) S.sim[S.cls][t.dataset.si]=v;
  if(t.dataset.si==='mg'){ const m=$('#mgv'); if(m) m.textContent=fmtN(v,0)+'%'; }
  const r=$('#simres'); if(r) r.innerHTML=simResults(S.cls);
});

</script>
</body></html>
