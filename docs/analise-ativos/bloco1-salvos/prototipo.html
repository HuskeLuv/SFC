<title>Salvos e Alertas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: casca do app (sidebar + área) igual ao protótipo v2.4 aprovado; bloco 1 = Salvos, filtros salvos,
   comparações salvas + PDF, alertas. Cores só de brandColors.ts (+ cinzas Tailwind do app). */
/* Layout: casca do app (sidebar + área), estrutura do protótipo do Pedro v2.4; cores só de brandColors.ts.
   Responsivo por container query na .app, para a bancada simular 390px dentro do desktop. */
:root{
  /* paleta My Finance (brandColors.ts) */
  --mf-potencia:#2D2D2D; --mf-seguranca:#314666; --mf-patrimonio:#396CAA; --mf-outside:#0079F2;
  --mf-tranquilidade:#6E9DC4; --mf-transparencia:#CCCCCC; --mf-escolha:#EAEAEA;
  /* superfícies e texto (cinzas do app, Tailwind gray) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface2:#F2F4F7; --line:#E4E7EC; --line2:#F2F4F7;
  --ink:#1D2939; --ink2:#344054; --muted:#667085; --soft:#98A2B3;
  /* papéis */
  --link:#396CAA; --btn-n:#314666; --btn-n-h:#396CAA; --btn-p:#396CAA; --btn-p-h:#314666;
  --on:#396CAA; --on-ink:#FFFFFF;
  --chip-on-bg:rgba(57,108,170,.10); --chip-on-ink:#314666; --chip-on-line:#396CAA;
  --thead:#314666; --thead-ink:#FFFFFF; --th-sort:#396CAA;
  --row-hover:#F9FAFB; --hi:#F2F4F7;
  --tint1:rgba(57,108,170,.10); --tint2:#F2F4F7; --tint3:rgba(57,108,170,.18);
  --mark:#344054; --mark-ink:#FFFFFF;
  --bar:#396CAA; --bar-soft:rgba(57,108,170,.18); --neg:#D92D20; --neg-bg:rgba(217,45,32,.08);
  --s1:#0079F2; --s2:#2D2D2D; --grid:#F2F4F7; --axis:#667085;
  --focus:#0079F2; --overlay:rgba(45,45,45,.45); --shadow:0 12px 32px rgba(45,45,45,.16);
  --skel:#F2F4F7; --info-bg:rgba(57,108,170,.10); --info-line:#396CAA;
  --nav-on-bg:rgba(57,108,170,.10); --nav-on-ink:#396CAA; --novo-bg:#396CAA;
  --pill-page-on:#314666;
  --font:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#18181B; --surface:#1F1F22; --surface2:#26262A; --line:#2E3440; --line2:#26262A;
  --ink:#F2F4F7; --ink2:#D0D5DD; --muted:#98A2B3; --soft:#667085;
  --link:#6E9DC4; --btn-n:#396CAA; --btn-n-h:#314666; --btn-p:#396CAA; --btn-p-h:#314666;
  --on:#396CAA; --on-ink:#FFFFFF;
  --chip-on-bg:rgba(57,108,170,.20); --chip-on-ink:#EAEAEA; --chip-on-line:#6E9DC4;
  --thead:#314666; --thead-ink:#FFFFFF; --th-sort:#396CAA;
  --row-hover:rgba(255,255,255,.03); --hi:#26262A;
  --tint1:rgba(57,108,170,.16); --tint2:#26262A; --tint3:rgba(57,108,170,.26);
  --mark:#D0D5DD; --mark-ink:#1F1F22;
  --bar:#6E9DC4; --bar-soft:rgba(110,157,196,.25); --neg:#F97066; --neg-bg:rgba(249,112,102,.10);
  --s1:#6E9DC4; --s2:#EAEAEA; --grid:rgba(255,255,255,.06); --axis:#98A2B3;
  --focus:#6E9DC4; --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --skel:#26262A; --info-bg:rgba(57,108,170,.14); --info-line:#6E9DC4;
  --nav-on-bg:rgba(57,108,170,.14); --nav-on-ink:#6E9DC4; --novo-bg:#396CAA; --pill-page-on:#396CAA;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#18181B; --surface:#1F1F22; --surface2:#26262A; --line:#2E3440; --line2:#26262A;
  --ink:#F2F4F7; --ink2:#D0D5DD; --muted:#98A2B3; --soft:#667085;
  --link:#6E9DC4; --btn-n:#396CAA; --btn-n-h:#314666; --btn-p:#396CAA; --btn-p-h:#314666;
  --on:#396CAA; --on-ink:#FFFFFF;
  --chip-on-bg:rgba(57,108,170,.20); --chip-on-ink:#EAEAEA; --chip-on-line:#6E9DC4;
  --thead:#314666; --thead-ink:#FFFFFF; --th-sort:#396CAA;
  --row-hover:rgba(255,255,255,.03); --hi:#26262A;
  --tint1:rgba(57,108,170,.16); --tint2:#26262A; --tint3:rgba(57,108,170,.26);
  --mark:#D0D5DD; --mark-ink:#1F1F22;
  --bar:#6E9DC4; --bar-soft:rgba(110,157,196,.25); --neg:#F97066; --neg-bg:rgba(249,112,102,.10);
  --s1:#6E9DC4; --s2:#EAEAEA; --grid:rgba(255,255,255,.06); --axis:#98A2B3;
  --focus:#6E9DC4; --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --skel:#26262A; --info-bg:rgba(57,108,170,.14); --info-line:#6E9DC4;
  --nav-on-bg:rgba(57,108,170,.14); --nav-on-ink:#6E9DC4; --novo-bg:#396CAA; --pill-page-on:#396CAA;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab-num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== bancada (só no protótipo) ===== */
.bench{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px;padding-inline:16px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.bench b{color:var(--ink2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.bench .grp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.bench select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{min-height:36px;padding:0 12px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);font-weight:600}
.frame-wrap{display:block}
.frame-wrap.phone{display:flex;justify-content:center;padding-block:16px;padding-inline:16px}
.frame-wrap.phone .app{width:390px;height:844px;overflow:auto;border:1px solid var(--line);border-radius:20px;transform:translateZ(0);box-shadow:var(--shadow)}

/* ===== casca ===== */
.app{container-type:inline-size;container-name:app;background:var(--bg)}
.shell{display:flex;min-height:100%}
aside.side{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:8px;padding:0 8px 20px;font-weight:700;font-size:18px;color:var(--ink)}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--mf-outside);display:inline-block}
.menu-label{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:0 8px 8px;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:13.5px;text-decoration:none}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--nav-on-bg);color:var(--nav-on-ink)}
.nav .novo{margin-left:auto;font-size:10px;letter-spacing:.08em;background:var(--novo-bg);color:#fff;padding:2px 6px;border-radius:99px;font-weight:700}
main.area{flex:1;min-width:0;padding-block:20px 56px;padding-inline:32px;max-width:1320px}
@container app (max-width: 760px){ aside.side{display:none} main.area{padding-inline:16px;padding-block:16px 40px} }

/* banner */
.banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.banner b{color:var(--ink)} .banner small{color:var(--muted);display:block;margin-top:2px}
.banner .txt{flex:1 1 320px;min-width:0}
/* pílulas de página (PilulasArea) */
.ptabs{display:inline-flex;gap:4px;margin-top:16px;background:var(--surface2);border-radius:10px;padding:4px}
.ptabs button{min-height:40px;padding:0 18px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--link)}
.ptabs button[aria-current="page"]{background:var(--pill-page-on);color:#fff}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:20px;flex-wrap:wrap}
h1{font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.search{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:min(360px,100%);color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.search kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;padding:6px;max-height:320px;overflow:auto}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:8px;text-align:left}
.sugg button:hover,.sugg button[aria-selected="true"]{background:var(--surface2)}
.sugg small{color:var(--muted)}
@container app (max-width: 760px){ .search{width:100%} }

/* botões (BOTAO_PRIMARIO / SECUNDARIO do app) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.n{background:var(--btn-n);border-color:var(--btn-n);color:#fff}.btn.n:hover{background:var(--btn-n-h)}
.btn.p{background:var(--btn-p);border-color:var(--btn-p);color:#fff}.btn.p:hover{background:var(--btn-p-h)}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:44px;display:inline-flex;align-items:center}
.link.inl{min-height:0;display:inline}

/* card principal */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card .hd{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .hd h3{font-weight:600;font-size:15px;margin:0}
.card .hd .hint{font-size:12.5px;color:var(--muted)}
.ctabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ctab{min-height:48px;padding:0 14px;font-size:14px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ctab .n{font-size:11.5px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:99px;font-weight:600}
.ctab[aria-selected="true"]{color:var(--link);border-color:var(--mf-outside);font-weight:600}
.ctab[aria-selected="true"] .n{background:var(--chip-on-bg);color:var(--chip-on-ink)}

/* barra de filtros */
.bar{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;flex-wrap:wrap}
.fl{font-weight:600;font-size:13.5px;margin-right:4px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:13px;font-weight:500;white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);border-color:var(--chip-on-line);color:var(--chip-on-ink);font-weight:600}
.chip .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:10px;line-height:1}
.chip[aria-pressed="true"] .ck::before{content:"✓";font-weight:700}
.chip small{font-weight:400;color:var(--muted);font-size:12px}
.chip.nd{border-style:dashed;color:var(--muted);cursor:not-allowed}
.chip.nd em{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:2px}
.pills{display:inline-flex;gap:2px;background:var(--surface2);border-radius:8px;padding:2px}
.pill{position:relative;min-height:32px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.pill::after{content:"";position:absolute;inset:-6px 0}
.pill[aria-pressed="true"],.pill[aria-checked="true"]{background:var(--on);color:var(--on-ink)}
.bar .sp{flex:1}
.meta{font-size:13px;color:var(--muted)} .meta b{color:var(--ink)}
.bar2{display:flex;align-items:center;gap:8px 12px;padding:4px 18px 12px;flex-wrap:wrap}
.critinfo{margin:0 18px 10px;font-size:12.5px;color:var(--muted)}
.critinfo summary{min-height:36px;display:inline-flex;align-items:center;cursor:pointer;color:var(--link);font-weight:600}
.critinfo dl{margin:6px 0 0;display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:4px 14px}
.critinfo dt{color:var(--ink2);font-weight:600}.critinfo dd{margin:0}
@container app (max-width: 760px){ .critinfo dl{grid-template-columns:1fr} .critinfo dd{margin-bottom:6px} }
.note-i{margin:0 18px 10px;padding:10px 12px;border-radius:10px;background:var(--info-bg);border-left:3px solid var(--info-line);font-size:12.5px;color:var(--ink2);line-height:1.45}
.popover{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-height:300px;overflow:auto}
.popover button{display:flex;width:100%;min-height:40px;align-items:center;padding:0 10px;border-radius:6px;text-align:left;font-size:13px}
.popover button:hover,.popover button[aria-checked="true"]{background:var(--surface2)}

/* tabela (TABLE_STYLES) */
.tbl-pad{padding:0 18px 18px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;color:var(--ink2)}
.tbl thead th{background:var(--thead);color:var(--thead-ink);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:0;white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl thead th>span,.tbl thead th>button{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-height:44px;padding:0 12px;width:100%;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit}
.tbl thead th:first-child>span,.tbl thead th:first-child>button{justify-content:flex-start}
.tbl thead th[aria-sort]:not([aria-sort="none"]){background:var(--th-sort)}
.tbl thead th button:hover{text-decoration:underline}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}.tbl tbody tr.click:hover td{background:var(--row-hover)}
.tbl .hi td{background:var(--hi);font-weight:600;color:var(--ink)}
.tk{display:flex;align-items:center;gap:10px}
.tk .ic{width:36px;height:36px;border-radius:8px;background:var(--chip-on-bg);color:var(--chip-on-ink);font-weight:700;font-size:11px;display:grid;place-items:center;flex-shrink:0}
.tk a,.tk .tkn{font-weight:600;font-size:14px;color:var(--link);text-decoration:none;display:block}
.tk a:hover{text-decoration:underline}
.tk small{color:var(--muted);font-size:12px;display:block}
.neg{color:var(--neg)} .mut{color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:6px}
.streak i{display:inline-flex;gap:2px}.streak i b{width:4px;height:12px;border-radius:2px;background:var(--line);display:block}.streak i b.on{background:var(--bar)}
.l10{display:inline-flex;align-items:center;gap:2px;height:28px}
.l10 .z{position:relative;height:28px;width:6px;display:inline-block}
.l10 .z b{position:absolute;left:0;width:6px;border-radius:2px;background:var(--bar)}
.crit{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;min-height:36px;padding:0 6px;border-radius:6px;position:relative}
.crit:hover{background:var(--surface2)}
.crit i{display:inline-flex;gap:2px}
.crit i b{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--muted);background:transparent}
.crit i b.on{background:var(--mark);border-color:var(--mark)}
.crit i b.na{border-style:dashed;opacity:.6}
.port{font-size:13px;color:var(--muted)} .port b{color:var(--ink);font-weight:600}
.empty{text-align:center!important;padding:32px 16px!important;color:var(--muted);white-space:normal!important}
.more{display:flex;justify-content:center;padding:14px 0 4px}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.note.c{text-align:center;padding:0 18px}
.tip{position:fixed;z-index:60;max-width:340px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;line-height:1.5;pointer-events:none}
.tip ul{margin:0;padding:0;list-style:none}.tip li{padding:2px 0}
.chiprail{display:contents}
/* cartões do Quadro (celular) */
.qcards{display:none;padding:0 12px 12px;gap:10px;flex-direction:column}
.qc{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.qc .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qc .top .pr{text-align:right;font-weight:600}
.qc dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.qc dt{font-size:11.5px;color:var(--muted)} .qc dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.qc .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:8px}
.ordm{display:none;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ordm select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
@container app (max-width: 760px){
  .qtable{display:none} .qcards{display:flex} .ordm{display:flex}
  .bar .meta{flex-basis:100%}
  .chiprail{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -18px;padding-inline:18px;flex-basis:calc(100% + 36px);scrollbar-width:thin}
  .chiprail .chip{flex-shrink:0}
}

/* skeleton / erro */
.skel{background:var(--skel);border-radius:6px;height:14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.errbox{margin:24px 18px;padding:20px;border:1px solid var(--line);border-radius:12px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.errbox .ico{width:36px;height:36px;border-radius:50%;background:var(--neg-bg);color:var(--neg);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.errbox h3{margin:0 0 4px;font-size:15px}.errbox p{margin:0 0 10px;color:var(--muted);font-size:13.5px}

/* ===== página do ativo ===== */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-size:13.5px;font-weight:600;min-height:44px;padding:4px 18px 0}
.dhead{display:flex;gap:16px 20px;align-items:flex-start;justify-content:space-between;padding:8px 18px 16px;flex-wrap:wrap}
.dhead .id{display:flex;gap:14px;align-items:center;min-width:0}
.dhead .big{width:52px;height:52px;border-radius:12px;background:var(--mf-seguranca);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.dhead h2{font-weight:700;font-size:22px;line-height:1.15;margin:0}
.dhead h2 span{font-weight:400;color:var(--muted)}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:500;color:var(--ink2);background:var(--surface2);padding:3px 8px;border-radius:6px}
.tag.st{border:1px solid var(--chip-on-line);color:var(--chip-on-ink);background:var(--chip-on-bg);font-weight:600}
.tag.st.plan{background:transparent;border-style:dashed;color:var(--ink2);border-color:var(--muted)}
.dright{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.price{text-align:right}.price b{font-weight:700;font-size:26px;display:block;line-height:1.1}
.price .var{font-size:13px;font-weight:600}.price small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@container app (max-width: 760px){
  .dright{align-items:stretch;width:100%}.price{text-align:left}
  .actions{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .actions .btn{width:100%;min-height:48px}
  .actions .btn.n{grid-column:1/-1}
}
.pad18{padding:0 18px 18px}
.grid{display:grid;gap:16px;margin-top:16px}
.grid>*{min-width:0}
.g-2{grid-template-columns:1fr 1fr}.g-14{grid-template-columns:minmax(260px,1fr) 3fr}.g-13{grid-template-columns:1fr 2fr}
@container app (max-width: 1100px){ .g-2,.g-14,.g-13{grid-template-columns:1fr} }
/* card critérios */
.critcard{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px 22px;align-items:start}
.critcard .total{text-align:center;padding-right:20px;border-right:1px solid var(--line);min-width:180px;display:flex;flex-direction:column;align-items:center;gap:8px}
.critcard .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.critcard .v{font-weight:700;font-size:42px;line-height:1;color:var(--ink)}
.critcard .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px}
.critcard .total>small{font-size:12px;color:var(--muted);max-width:22ch}
.clist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ci{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ci.na{border-style:dashed}
.ci-h{display:flex;align-items:center;gap:8px}.ci-h b{font-size:14px;font-weight:600}
.ci p{font-size:13px;color:var(--ink2);margin:0;line-height:1.4}.ci small{font-size:12px;color:var(--muted);line-height:1.4}
.yn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);font-size:12px;color:var(--muted);font-weight:700;flex-shrink:0}
.yn.y{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.yn.na{border-style:dashed;font-size:10px;width:auto;border-radius:6px;padding:0 6px;height:20px}
.spk{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.spk b{width:10px;border-radius:2px;background:var(--bar)}.spk b.n{background:var(--soft)}
.critfoot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);line-height:1.5}
@container app (max-width: 1100px){ .clist{grid-template-columns:repeat(2,1fr)} }
@container app (max-width: 760px){ .critcard{grid-template-columns:1fr}.critcard .total{border:0;padding:0;align-items:flex-start;text-align:left}.clist{grid-template-columns:1fr} }
/* carteira + KPIs */
.q{border-radius:10px;padding:14px 16px;background:var(--tint2)}
.q.b{background:var(--tint1)}.q.b2{background:var(--tint3)}
.q .l{font-size:12px;color:var(--muted);font-weight:500}
.q .v{font-weight:700;font-size:19px;margin-top:6px;line-height:1.15;font-variant-numeric:tabular-nums}
.q .s{font-size:12px;color:var(--muted);margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@container app (max-width: 760px){ .kpis{grid-template-columns:1fr 1fr} }
.posbar{position:relative;margin-top:12px;height:8px;border-radius:99px;background:var(--surface)}
.posbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--bar)}
.posbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-50%)}
.posline{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.conf{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink2);border:1px dashed var(--muted);border-radius:99px;padding:1px 7px;margin-left:4px;white-space:nowrap}
/* gráficos */
.ch{padding:14px 18px 10px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
.yt td.yr{font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1}
.yt .hi td.yr{background:var(--hi)}
.tbl.yt th,.tbl.yt td{padding-left:8px;padding-right:8px}
.tbl.yt thead th>span{padding:0 8px}
.qf-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:12px 0 8px}
.qf-title{font-weight:600;font-size:14px;margin:16px 0 8px}
.tbl.qf td.lbl{text-align:left;font-weight:500;color:var(--ink2);position:sticky;left:0;background:var(--surface);z-index:1}
.tbl.qf tr.ratio td{color:var(--muted);background:var(--surface2)}.tbl.qf tr.ratio td.lbl{background:var(--surface2);font-weight:400;font-style:italic}
/* valuation */
.hsub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.vbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:14px 18px 0}
.vbar .chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.vsum{font-size:13px;color:var(--muted)}.vsum b{color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 18px}
.vc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:flex;flex-direction:column}
.vc .l{font-size:12.5px;color:var(--muted);font-weight:600}
.vc .v{font-weight:700;font-size:22px;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.vc p{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.45;flex:1}
.rng{position:relative;height:8px;border-radius:99px;background:var(--surface2);margin-top:14px;border:1px solid var(--line)}
.rng .avg{position:absolute;top:-5px;width:2px;height:16px;background:var(--muted);transform:translateX(-50%)}
.rng .cur{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--mf-outside);border:2px solid var(--surface);transform:translateX(-50%)}
.rng-l{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.vc-st{font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:6px}
.vc-ref{font-size:12px;color:var(--muted);margin-top:4px}
@container app (max-width: 1100px){ .vgrid{grid-template-columns:repeat(2,1fr)} }
@container app (max-width: 760px){ .vgrid{grid-template-columns:1fr} }
.sim{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;padding:14px 18px 18px}.sim>div{min-width:0}
.inp{border:1px solid var(--line);border-radius:12px;padding:6px 14px 12px;background:var(--surface2)}
.inp h4{font-size:13.5px;font-weight:600;margin:12px 0 4px}.inp h4 small{font-weight:400;color:var(--muted);font-size:12px}
.inp label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:6px 0;border-bottom:1px dashed var(--line)}
.inp label>span:first-child{min-width:0}
.inp .in{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}.inp .in em{font-style:normal;font-size:12px;color:var(--muted);min-width:40px}
.inp input[type=text]{width:88px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;text-align:right;background:var(--surface);font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--muted)}
.inp label.rg{flex-direction:column;align-items:stretch;gap:8px;border:0;padding-top:12px}
.inp input[type=range]{width:100%;accent-color:var(--mf-patrimonio);min-height:32px}
.need{font-weight:500;color:var(--muted);font-size:13px}
.tbl.sim-t td,.tbl.sim-t th{white-space:normal;vertical-align:middle}
.tbl.sim-t td.lbl{min-width:190px;color:var(--ink);text-align:left}
.tbl.sim-t td.lbl small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
.tbl.sim-t td.mono{color:var(--muted);font-size:12.5px;text-align:left}
.tbl.sim-t td:nth-child(n+3){white-space:nowrap}
.rbs{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rbs-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.rbs-h b{color:var(--ink2)}
.rb{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.rb-t{position:relative;height:14px;background:var(--surface2);border-radius:4px}.rb-t i{display:block;height:100%;background:var(--bar);border-radius:4px}
.rb-t em{position:absolute;top:-3px;width:2px;height:20px;background:var(--ink);transform:translateX(-50%)}
.rb-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sim-goal{display:grid;grid-template-columns:2fr 1fr 2fr;gap:12px;margin-top:12px;background:var(--tint1);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.sim-goal .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}.sim-goal b{color:var(--ink);font-size:15px}
.sim-mine{margin-top:12px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap;gap:8px}
@container app (max-width: 1100px){ .sim{grid-template-columns:1fr} }
@container app (max-width: 760px){ .rb{grid-template-columns:1fr}.rb-v{text-align:left}.sim-goal{grid-template-columns:1fr} }
.mini{display:grid;gap:12px;padding:14px 18px}
.mini .m{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.mini .m .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.mini .m .l b{color:var(--ink);font-size:14px}
.m4{grid-template-columns:repeat(4,1fr)}
@container app (max-width: 1100px){ .m4{grid-template-columns:repeat(2,1fr)} }
@container app (max-width: 760px){ .m4{grid-template-columns:1fr} }
.ev{list-style:none;padding:6px 18px 14px;margin:0}.ev li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center}
.ev li:last-child{border:0}
.ev .d{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-weight:700;font-size:14px;line-height:1.1;background:var(--surface2)}
.ev .d small{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ev b{font-weight:600;font-size:13.5px;display:block}.ev span{font-size:12.5px;color:var(--muted)}
.edu{margin-top:16px;padding:16px 18px;border-radius:12px;background:linear-gradient(118deg,#314666,#396CAA);color:#fff}
.edu .e{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#EAEAEA;font-weight:600}
.edu h4{font-weight:700;font-size:16px;margin:5px 0 0}.edu p{font-size:13px;color:#EAEAEA;margin:5px 0 10px;line-height:1.5}
.edu .btn{background:#fff;color:#314666;border-color:#fff}
.tese textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;resize:vertical;background:var(--surface)}
.tese .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.fresh{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:16px}

/* ===== comparador ===== */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px 6px}
.slot{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2);min-width:0}
.slot .rm{position:absolute;right:2px;top:2px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.slot .sp-price{margin-top:8px;font-weight:600;font-size:14px}
.slot.add{border-style:dashed;background:transparent;display:flex;flex-direction:column;justify-content:center;gap:6px;color:var(--link);font-weight:600;font-size:13.5px;min-height:96px}
.slot.add .sg{display:flex;gap:6px;flex-wrap:wrap}
.slot.add .sg button{min-height:36px;padding:0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);font-weight:500}
@container app (max-width: 1100px){ .slots{grid-template-columns:repeat(2,1fr)} }
@container app (max-width: 760px){ .slots{grid-template-columns:1fr} }
.mix{margin:12px 18px 0;padding:12px 14px;border-radius:10px;background:var(--info-bg);border-left:3px solid var(--info-line);font-size:13.5px;line-height:1.5;color:var(--ink2)}
.mix b{color:var(--ink)}
.tbl.cmp th,.tbl.cmp td{text-align:center}
.tbl.cmp thead th>span{justify-content:center}
.tbl.cmp thead th:first-child>span{justify-content:flex-start}
.tbl.cmp td.lbl,.tbl.cmp th:first-child{text-align:left}
.tbl.cmp td.lbl{color:var(--muted);font-weight:500;white-space:normal;min-width:170px;position:sticky;left:0;background:var(--surface);z-index:1}
.tbl.cmp tr.grp td{background:var(--surface2);color:var(--ink);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;text-align:left}
.tbl.cmp tr.tot td{border-top:2px solid var(--line);padding:12px;color:var(--ink)}
.ynf{display:block;font-size:12px;color:var(--muted);margin-top:4px;white-space:normal;line-height:1.35;max-width:240px;margin-inline:auto}
.verdict{margin:0 18px 18px;padding:16px 18px;border-radius:12px;background:var(--tint1);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.verdict .e{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.verdict b{font-size:15px;display:block;margin-top:4px}.verdict p{font-size:13px;color:var(--ink2);margin:6px 0 0;line-height:1.5;max-width:75ch}
.ccards{display:none;padding:0 18px 18px;flex-direction:column;gap:12px}
.ccard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ccard h4{margin:0;padding:10px 12px;background:var(--surface2);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ccard .r{padding:10px 12px;border-top:1px solid var(--line2)}
.ccard .r>span{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.ccard .vals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccard .vals div{font-size:13.5px;font-variant-numeric:tabular-nums}.ccard .vals small{display:block;color:var(--muted);font-size:12px}
@container app (max-width: 760px){ .ctable{display:none} .ccards{display:flex} }

/* ===== modal / bottom sheet / toast ===== */
.modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(660px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mbox.sm{width:min(500px,100%)}
.mhead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.mhead h3{font-size:17px;font-weight:600;margin:0 0 4px}.mhead p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
.mclose{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;font-size:22px;color:var(--muted);border-radius:8px}
.mclose:hover{background:var(--surface2)}
.mbody{overflow:auto;padding:0 20px 8px}
.mpick{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px}
.mpick .fixed{background:var(--btn-n);border-color:var(--btn-n);color:#fff}
.mpick .ghost{border-style:dashed;color:var(--muted);cursor:default}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 32px;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;min-height:52px;width:100%;text-align:left}
.mrow:hover{background:var(--surface2)}.mrow[aria-checked="true"]{background:var(--chip-on-bg)}.mrow[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.mrow .ic{width:40px;height:36px;border-radius:8px;background:var(--mf-seguranca);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.mrow .nm b{font-size:14px;display:block}.mrow .nm small{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mt{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mrow .ckc{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.mrow[aria-checked="true"] .ckc{background:var(--on);color:#fff;border-color:var(--on)}
.mfoot{display:flex;align-items:center;gap:10px;padding:12px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot .hint{flex:1 1 180px;font-size:13px;color:var(--muted)}
.mform label,.mform .fr{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2);padding:8px 0;border-bottom:1px dashed var(--line)}
.mform input,.mform select{width:160px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface2);text-align:right}
.mform select{text-align:left}
.mform .in{display:inline-flex;align-items:center;gap:6px}.mform .in em{font-style:normal;font-size:13px;color:var(--muted)}.mform .in input{width:120px}
.mform .ro{font-size:13px;text-align:right;color:var(--ink2)}
.rsum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;background:var(--tint1);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.rsum b{color:var(--ink);display:block;font-size:14.5px}
.err-inline{color:var(--neg);font-size:12.5px;margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}
.pgrid>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pgrid .e,.ops .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.pgrid b{display:block;font-size:17px}.pgrid small{font-size:12px;color:var(--muted)}
.pempty{padding:14px 0;font-size:14px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mf-seguranca);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:70;max-width:min(680px,calc(100% - 32px))}
.grab{display:none;width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}
@container app (max-width: 760px){
  .modal{align-items:flex-end;padding:0}
  .mbox,.mbox.sm{width:100%;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .grab{display:block}
  .mrow{grid-template-columns:36px minmax(0,1fr) 32px}.mrow .mt{display:none}
  .mform input,.mform select{width:130px}.mform .in input{width:100px}
  .pgrid{grid-template-columns:1fr 1fr}
  .mfoot .btn{flex:1 1 auto}
}
footer.legal{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--muted);max-width:110ch}
footer.legal b{color:var(--ink2)}

/* alvos de toque ≥ 44 px (revisão) */
.chip::after,.pill::after{inset:auto 0;top:50%;height:max(100%,44px);transform:translateY(-50%)}
.crit{min-height:44px}
.tk a,.tklink{position:relative}
.tk a::after,.tklink::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:44px;transform:translateY(-50%)}
.tklink{color:var(--link);font-weight:600;text-decoration:none}
.search{min-height:46px}
.search input{align-self:stretch;min-height:44px}
.inp input[type=range]{min-height:44px}
.seg button{min-height:44px}
.slot.add .sg button{min-height:44px;padding:0 14px}
.link.inl{position:relative}
.link.inl::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:44px;transform:translateY(-50%)}
.critinfo summary{min-height:44px}
.popover button{min-height:44px}
.ptabs button{min-height:44px}
.inp input[type=text]{min-height:44px}
.legal-prov{display:block;margin-top:6px;font-style:italic;color:var(--muted)}

/* ===================== BLOCO 1 — tokens novos ===================== */
:root{
  --pill-bg:#F2F4F7; --pill-on-bg:#FFFFFF; --pill-on-ink:#1D2939; --pill-ink:#475467;
  --sw-off:#CCCCCC; --danger:#D92D20; --danger-h:#B42318;
  /* papel do PDF: igual nos dois temas (é uma folha impressa) */
  --paper:#FFFFFF; --paper-ink:#2D2D2D; --paper-mut:#667085; --paper-line:#E4E7EC; --paper-head:#314666; --paper-tint:rgba(57,108,170,.10);
  --badge:#0079F2; --lock:#26262A; --lock-ink:#F2F4F7; --lock-card:rgba(255,255,255,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --pill-bg:rgba(255,255,255,.06); --pill-on-bg:#26262A; --pill-on-ink:#FFFFFF; --pill-ink:#98A2B3;
  --sw-off:#475467; --danger:#F97066; --danger-h:#D92D20; --badge:#0079F2; color-scheme:dark }}
:root[data-theme="dark"]{
  --pill-bg:rgba(255,255,255,.06); --pill-on-bg:#26262A; --pill-on-ink:#FFFFFF; --pill-ink:#98A2B3;
  --sw-off:#475467; --danger:#F97066; --danger-h:#D92D20; --badge:#0079F2; color-scheme:dark }

.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.f{fill:currentColor}
/* bancada */
.bench{position:relative;z-index:80}
.bench .note-b{flex-basis:100%;font-size:12.5px;color:var(--ink2);line-height:1.45}
.frame-wrap.desk{overflow-x:auto}
.frame-wrap.desk .app{width:1440px}
.frame-wrap.phone.w320 .app{width:320px;height:700px}
.frame-wrap.phone .app{overflow:hidden}
.frame-wrap.phone .shell{height:100%;overflow:auto}

/* topo do app (sino) */
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:14px;position:relative}
.topbar .mlogo{display:none;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:auto}
.topbar .mlogo i{width:24px;height:24px;border-radius:7px;background:var(--mf-outside);display:inline-block}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn .i{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--mf-seguranca);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
@container app (max-width: 760px){ .topbar .mlogo{display:flex} }

/* pílulas da área = PilulasArea real (branco sobre cinza) */
.ptabs{display:inline-flex;gap:2px;margin-top:4px;background:var(--pill-bg);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.ptabs button{position:relative;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--pill-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-current="page"]{background:var(--pill-on-bg);color:var(--pill-on-ink);box-shadow:0 1px 2px rgba(16,24,40,.10)}
.ptabs .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
@container app (max-width: 420px){ .ptabs{display:flex;width:100%} .ptabs button{flex:1 1 0;padding:0 8px;justify-content:center;font-size:13.5px} }

.head-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.head-act .search{width:360px;max-width:100%}
.frame-wrap:not(.phone) .modal{top:var(--bench-h,0px)}
@container app (max-width: 760px){ .head-act{width:100%} .head-act .search{flex:1 1 220px} .head-act .btn{flex:0 0 auto} }
@container app (max-width: 420px){ .head-act .search{flex:1 1 0} .head-act .btn .lbl{display:none} .head-act .btn{min-width:44px;padding:0 12px;justify-content:center} }
.svline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 18px 12px;font-size:13px;color:var(--ink2);line-height:1.5}
.svline .btn{min-height:44px}
.pdfnote{display:grid;gap:10px;font-size:13px;line-height:1.5;color:var(--ink2)}
.pdfnote h4{margin:6px 0 0;font-size:13.5px;color:var(--ink)}
.pdfnote ul{margin:0;padding-left:18px;display:grid;gap:4px}
.pdfready{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border-left:3px solid var(--info-line);border-radius:10px;padding:10px 12px}
.verdict .btn{flex-shrink:0}
.protonote{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:8px;display:inline-block}

.acting{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border-left:3px solid var(--info-line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.acting b{color:var(--ink)}

/* botões extras */
.btn.d{background:var(--danger);border-color:var(--danger);color:#fff}.btn.d:hover{background:var(--danger-h)}
.btn[aria-pressed="true"]{background:var(--chip-on-bg);border-color:var(--chip-on-line);color:var(--chip-on-ink);font-weight:600}
.btn[aria-busy="true"]{cursor:progress}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}
.icon44{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);flex-shrink:0}
.icon44:hover{background:var(--surface2);color:var(--ink)}
.icon44.dz:hover{color:var(--danger)}
.bm{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted)}
.bm:hover{background:var(--surface2);color:var(--ink)}
.bm[aria-pressed="true"]{color:var(--link)}
.bm[aria-pressed="true"] .i{fill:currentColor}
.bm .i{width:18px;height:18px}
.tbl td.bmc{padding:0 6px;width:56px}

/* barra de filtros salvos */
.fsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fapplied{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 18px 10px;padding:8px 8px 8px 12px;border:1px solid var(--chip-on-line);background:var(--chip-on-bg);border-radius:10px;font-size:13px;color:var(--chip-on-ink)}
.fapplied b{font-weight:600}
.fapplied .sp{flex:1}
.fapplied .mod{font-size:12px;color:var(--muted);font-style:italic}

/* Salvos */
.lrail{display:flex;gap:8px;align-items:center;padding:14px 18px 6px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:500;font-size:13.5px;white-space:nowrap}
.lchip:hover{background:var(--surface2)}
.lchip[aria-current="true"]{background:var(--chip-on-bg);border-color:var(--chip-on-line);color:var(--chip-on-ink);font-weight:600}
.lchip .n{font-size:11.5px;color:var(--muted);background:var(--surface2);padding:1px 7px;border-radius:99px;font-weight:600}
.lchip[aria-current="true"] .n{background:var(--surface);color:var(--chip-on-ink)}
.lchip .i.bell{width:13px;height:13px;color:var(--muted)}
.lchip.add{border-style:dashed;color:var(--link);font-weight:600}
@container app (max-width: 760px){ .lrail{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:10px} .lchip{flex-shrink:0} }
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:8px 18px 12px}
.lhead h2{font-size:18px;font-weight:700;margin:0;line-height:1.2;overflow-wrap:anywhere}
.lhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.lhead .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lhead>div:first-child{min-width:0}
@container app (max-width: 760px){ .lhead .acts .btn .lbl{display:none} .lhead .acts .btn{padding:0 12px;min-width:44px;min-height:44px;justify-content:center} }
.segw{display:inline-flex;gap:2px;background:var(--surface2);border-radius:10px;padding:3px}
.segw button{min-height:44px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;position:relative}
.segw button::after{content:"";position:absolute;inset:-2px 0}
.segw button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.segw .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--badge);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.segw button[aria-pressed="true"] .cnt{background:#fff;color:var(--mf-seguranca)}
.alc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink2);font-weight:500;white-space:nowrap}
.alc:hover{background:var(--surface2)}
.alc.off{color:var(--muted)}
.alc .i{width:14px;height:14px}
.chg{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;text-align:left;padding-left:6px}
.salvo-em{font-size:12px;color:var(--muted)}
.qc .act{display:flex;gap:4px;align-items:center}

/* estado vazio */
.estado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 18px 48px}
.estado .eic{width:52px;height:52px;border-radius:14px;background:var(--tint1);color:var(--chip-on-ink);display:grid;place-items:center}
.estado .eic .i{width:24px;height:24px}
.estado h3{margin:4px 0 0;font-size:16.5px;font-weight:600;text-wrap:balance}
.estado p{margin:0;max-width:56ch;color:var(--muted);font-size:13.5px;line-height:1.55}
.estado .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.estado.sm{padding:28px 18px}

/* formulário de lista */
.fld{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.fld label{font-size:13.5px;font-weight:600;color:var(--ink2)}
.fld input[type=text]{min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:15px;width:100%}
.fld input[aria-invalid="true"]{border-color:var(--danger)}
.fld .help{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.fld .err{color:var(--danger);font-size:12.5px}
.sumbox{background:var(--tint1);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);line-height:1.55;margin:4px 0 10px}
.sumbox b{color:var(--ink)}
.sumbox ul{margin:4px 0 0;padding-left:18px}
.lim{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--ink2);line-height:1.5;margin:4px 0 10px}

/* chooser (popover desktop / sheet celular) */
.pop{position:fixed;z-index:45;width:340px;max-width:calc(100% - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:min(480px,calc(100vh - 32px))}
.pop .ph,.mbox .ph{padding:14px 16px 6px}
.ph h3{margin:0;font-size:15px;font-weight:600}
.ph p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.pop .pb,.mbox .pb{overflow:auto;padding:4px 8px}
.pop .pf,.mbox .pf{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 12px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.chk{display:flex;gap:12px;align-items:center;min-height:52px;padding:6px 8px;border-radius:8px;cursor:pointer}
.chk:hover{background:var(--surface2)}
.chk input{width:20px;height:20px;accent-color:var(--mf-patrimonio);flex-shrink:0;margin:0}
.chk b{display:block;font-size:14px;font-weight:600}
.chk small{display:block;font-size:12px;color:var(--muted)}
.chk.dis{opacity:.55;cursor:not-allowed}
.rowadd{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 10px;border-radius:8px;color:var(--link);font-weight:600;font-size:13.5px;text-align:left}
.rowadd:hover{background:var(--surface2)}
.frow{display:flex;align-items:center;gap:2px;border-radius:8px}
.frow .ap{flex:1;min-width:0;text-align:left;padding:8px 10px;min-height:56px;border-radius:8px}
.frow .ap:hover{background:var(--surface2)}
.frow .ap[aria-current="true"]{background:var(--chip-on-bg)}
.frow .ap b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.frow .ap small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.frow.cf{background:var(--surface2);padding:8px 10px;gap:8px;flex-wrap:wrap;font-size:13px}
.frow.cf span{flex:1 1 160px}

/* switches */
.sw{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.sw:last-child{border-bottom:0}
.sw .tx{flex:1;min-width:0}
.sw .tx b{display:block;font-size:14px;font-weight:600}
.sw .tx small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.tg{position:relative;width:46px;height:28px;border-radius:99px;background:var(--sw-off);flex-shrink:0;margin-top:2px;transition:background .15s}
.tg::before{content:"";position:absolute;inset:-8px -2px}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tg[aria-checked="true"]{background:var(--mf-patrimonio)}
.tg[aria-checked="true"]::after{transform:translateX(18px)}
.tg:disabled{opacity:.45;cursor:not-allowed}
.fixo{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface2);border-radius:99px;padding:4px 10px;white-space:nowrap;margin-top:2px}
.radio{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:8px;cursor:pointer;min-height:48px}
.radio:hover{background:var(--surface2)}
.radio input{width:20px;height:20px;accent-color:var(--mf-patrimonio);margin:2px 0 0;flex-shrink:0}
.radio b{display:block;font-size:14px;font-weight:600}.radio small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.subsw{margin:0 0 4px 32px;padding:0 10px;border-left:2px solid var(--line)}

/* alertas */
.agrid{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.agrid>*{min-width:0}
.aprefs{border-left:1px solid var(--line);padding:14px 18px 18px}
.aprefs h3{font-size:14.5px;font-weight:600;margin:0 0 2px}
.aprefs>p{font-size:12.5px;color:var(--muted);margin:0 0 6px;line-height:1.5}
@container app (max-width: 1100px){ .agrid{grid-template-columns:1fr} .aprefs{border-left:0;border-top:1px solid var(--line)} }
.atop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px 0;font-size:13px;color:var(--muted)}
.atop b{color:var(--ink)}
.alist{list-style:none;margin:0;padding:0 10px 14px}
.aday{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:16px 8px 6px}
.ai{display:grid;grid-template-columns:36px minmax(0,1fr) 10px;gap:12px;padding:12px 8px;border-radius:10px;align-items:start;width:100%;text-align:left}
.ai:hover{background:var(--row-hover)}
.ai .aic{width:36px;height:36px;border-radius:10px;background:var(--tint1);color:var(--chip-on-ink);display:grid;place-items:center}
.ai .aic .i{width:18px;height:18px}
.ai b{font-size:14px;font-weight:600;display:block}
.ai .p{display:block;margin:3px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.ai small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.ai .dot{width:9px;height:9px;border-radius:50%;background:var(--badge);margin-top:6px}
.ai.lido .dot{background:transparent}
.how{display:grid;gap:10px;margin-top:12px}
.how .e{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lock{background:var(--lock);color:var(--lock-ink);border-radius:16px;padding:12px}
.lock .nt{background:var(--lock-card);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;line-height:1.4}
.lock .nt i{grid-row:1/3;width:26px;height:26px;border-radius:7px;background:#0079F2;display:block}
.lock .nt b{font-weight:600}
.lock .nt time{font-size:11px;opacity:.75}
.lock .nt span{grid-column:2/4;opacity:.85}
.limits{font-size:12.5px;color:var(--muted);line-height:1.55;margin:10px 0 0;padding:10px 12px;background:var(--surface2);border-radius:10px}

/* sino */
.ndrop{position:absolute;right:0;top:calc(100% + 8px);width:380px;max-width:calc(100cqw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:44;overflow:hidden}
.ndrop .nh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ndrop .nh b{font-size:14.5px}
.ndrop ul{list-style:none;margin:0;padding:6px;max-height:380px;overflow:auto}
.ndrop li button{display:grid;grid-template-columns:minmax(0,1fr) 9px;gap:10px;width:100%;text-align:left;padding:10px;border-radius:8px;min-height:52px}
.ndrop li button:hover{background:var(--surface2)}
.ndrop li b{font-size:13.5px;display:block}.ndrop li span{font-size:12.5px;color:var(--ink2);display:block;margin-top:2px;line-height:1.4}
.ndrop li small{font-size:11.5px;color:var(--muted);display:block;margin-top:4px}
.ndrop li .dot{width:9px;height:9px;border-radius:50%;background:var(--badge);margin-top:5px}
.ndrop .nf{border-top:1px solid var(--line);padding:6px 10px;display:flex;justify-content:center}

/* comparador: barra e lista de comparações */
.cbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:14px 18px 4px}
.cbar .ins{flex:1 1 280px;font-size:13px;color:var(--muted);min-width:0}
.cbar .ins b{color:var(--ink);font-weight:600}
@container app (max-width: 760px){ .cbar .btn{flex:1 1 calc(50% - 5px)} .cbar .btn.n{flex-basis:100%} }

/* PDF */
.pdfw{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.pdfw>*{min-width:0}
.pdfopts h4{margin:6px 0 4px;font-size:13.5px}
.pdfopts .chk{min-height:48px}
.pdfstage{background:var(--surface2);border-radius:12px;padding:16px;display:flex;justify-content:center;overflow:hidden}
.paper{width:100%;max-width:560px;aspect-ratio:210/297;background:var(--paper);color:var(--paper-ink);box-shadow:0 6px 20px rgba(45,45,45,.18);padding:6% 6.5%;display:flex;flex-direction:column;gap:2.2%;font-size:clamp(6.5px,1.55cqw,9.5px);line-height:1.4;container-type:inline-size;overflow:hidden}
.paper .pt{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--paper-head);padding-bottom:2%}
.paper .pt .wm{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--paper-head);font-size:1.45em}
.paper .pt .wm i{width:1.3em;height:1.3em;border-radius:3px;background:#0079F2;display:inline-block}
.paper .pt small{color:var(--paper-mut)}
.paper h5{margin:0;font-size:1.6em;font-weight:700;color:var(--paper-ink);text-wrap:balance}
.paper .pm{color:var(--paper-mut)}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{background:var(--paper-head);color:#fff;font-weight:600;text-align:center;padding:.6em .5em}
.paper th:first-child{text-align:left}
.paper td{border-bottom:1px solid var(--paper-line);padding:.5em;text-align:center;color:var(--paper-ink)}
.paper td:first-child{text-align:left;color:var(--paper-mut)}
.paper tr.g td{background:var(--paper-tint);color:var(--paper-ink);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.9em}
.paper tr.t td{font-weight:700;color:var(--paper-ink)}
.paper .rd{background:var(--paper-tint);border-radius:4px;padding:2% 3%;color:var(--paper-ink)}
.paper .rd b{display:block;margin-bottom:.3em}
.paper .pf{margin-top:auto;border-top:1px solid var(--paper-line);padding-top:2%;color:var(--paper-mut);font-size:.88em}
.paper .pf .pg{display:flex;justify-content:space-between;margin-top:.6em}
@container app (max-width: 860px){ .pdfw{grid-template-columns:1fr} }
.mbox.lg{width:min(1000px,100%)}

/* toast com ação */
.toast{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toast .ta{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:2px;min-height:44px;padding:0 6px;margin:-12px -6px -12px 0}
@container app (max-width: 760px){ .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))} }
/* detalhe do ativo (só o necessário para o bloco) */
.ghostblk{margin:0 18px 18px;padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
.crow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.crow .v{font-weight:700;font-size:26px}.crow .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.svwrap{position:relative;display:inline-flex}

 ['anun','Provento anunciado','Quando sai um novo dividendo, JCP ou rendimento, com valor por ação ou cota, data-com e data de pagamento.'],
 ['crit','A contagem de critérios mudou','Quando o número de critérios atendidos na janela de 5 anos muda na atualização diária (por exemplo, de 5 de 6 para 4 de 6). Vem desligado.']];

/* ---------------- utilitários de tela ---------------- */
const main=$('#main'),app=$('#app'),modalRoot=$('#modalRoot'),popRoot=$('#popRoot'),toastRoot=$('#toastRoot'),tip=$('#tip');
const narrow=()=>app.getBoundingClientRect().width<760;
let toastFn=null;
function toast(msg,act){toastFn=act?act.fn:null;toastRoot.innerHTML=`<div class="toast" role="status"><span>${msg}</span>${act?`<button type="button" class="ta" data-toastact>${esc(act.l)}</button>`:''}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>{toastRoot.innerHTML='';toastFn=null;},act?6000:3400);}
toastRoot.addEventListener('click',e=>{if(e.target.closest('[data-toastact]')&&toastFn){const f=toastFn;toastRoot.innerHTML='';toastFn=null;f();}});
function tkCell(r){return `<span class="tk"><span class="ic" aria-hidden="true">${r.t.slice(0,4)}</span><span><a href="#${r.t}" data-open="${r.t}">${r.t}</a><small>${esc(r.n)}</small></span></span>`;}
function streak(v){const n=Math.max(0,Math.min(10,v||0));return `<span class="streak"><i aria-hidden="true">${Array.from({length:10},(_,i)=>`<b class="${i<n?'on':''}"></b>`).join('')}</i>${v>=10?'10+ anos':n+(n===1?' ano':' anos')}</span>`;}
const pct=(v,neg=true)=>v==null?'<span class="mut">—</span>':`<span class="${neg&&v<0?'neg':''}">${fmtN(v,1)}%</span>`;
function critCell(cls,r,win,showPrev){const b=bits(r,win),n=b.filter(Boolean).length;const lines=CRIT[cls].map((c,i)=>`${b[i]?'✓ atende':'— não atende'} · ${c[1]}`);
  const prev=showPrev&&PREV[r.t]!=null&&win===5?`<small class="chg">antes ${PREV[r.t]} de 6 · 16/10</small>`:'';
  return `<span><button type="button" class="crit" data-tip="${esc(`<b>${r.t} · ${n} de 6 critérios em ${win} anos</b><ul>${lines.map(l=>'<li>'+esc(l)+'</li>').join('')}</ul>`)}" aria-label="${esc(`${r.t}: ${n} de 6 critérios em ${win} anos. `+lines.join('. '))}"><i aria-hidden="true">${b.map(x=>`<b class="${x?'on':''}"></b>`).join('')}</i>${n} de 6</button>${prev}</span>`;}
function portCell(t,cls){const p=POS[t];return p?`<span class="port"><b>${p[0]}</b> ${CLS[cls].un} · <b>${fmtN(p[1],1)}%</b></span>`:'<span class="port" aria-label="não está na carteira">—</span>';}
function bmBtn(t){const ls=listsOf(t);const on=ls.length>0;
  if(S.acting)return `<button type="button" class="bm" disabled aria-label="Salvar ${t} (indisponível no modo consultor)" title="As listas são pessoais e não aparecem no modo consultor.">${ic('bm')}</button>`;
  return `<button type="button" class="bm" data-bm="${t}" aria-pressed="${on}" aria-haspopup="${S.lists.length>=2?'dialog':'false'}" aria-label="${on?`${t} salvo em ${esc(ls.map(l=>l.nome).join(' e '))}. Mudar listas`:`Salvar ${t}`}">${ic('bm')}</button>`;}
function skeleton(rows=6){return `<div class="tbl-pad" aria-busy="true"><span class="sr">Carregando…</span><div class="tbl-wrap" style="padding:14px;display:grid;gap:14px">${Array.from({length:rows},(_,i)=>`<div style="display:grid;grid-template-columns:2fr repeat(5,1fr);gap:16px">${Array.from({length:6},()=>`<span class="skel" style="width:${60+((i*7)%35)}%"></span>`).join('')}</div>`).join('')}</div></div>`;}
function errBox(what){return `<div class="errbox" role="alert"><span class="ico" aria-hidden="true">!</span><div><h3>Não foi possível carregar ${what}</h3><p>A conexão com o servidor falhou. Seus dados estão guardados; tente de novo em instantes.</p><button type="button" class="btn" data-retry>Tentar de novo</button></div></div>`;}

/* ---------------- Quadro ---------------- */
function filtered(){let rows=DB[S.cls].slice();const act=Object.keys(S.crit).filter(k=>S.crit[k]);
  if(act.length)rows=rows.filter(r=>{const b=bits(r,S.win);return act.every(id=>b[CRIT[S.cls].findIndex(c=>c[0]===id)]);});
  if(S.port)rows=rows.filter(r=>POS[r.t]);if(S.setor)rows=rows.filter(r=>r.setor===S.setor);return{rows,act};}
const curFilter=()=>({win:S.win,crit:Object.keys(S.crit).filter(k=>S.crit[k]),setor:S.setor,port:S.port});
const sameF=(a,b)=>a.win===b.win&&a.setor===b.setor&&a.port===b.port&&[...a.crit].sort().join()===[...b.crit].sort().join();
function fSummary(f,cls){const parts=[`${f.win} anos`];if(f.crit.length)parts.push(f.crit.map(id=>CRIT[cls].find(c=>c[0]===id)[1]).join(', '));if(f.setor)parts.push((cls==='acoes'?'Setor: ':'Segmento: ')+f.setor);if(f.port)parts.push('Na minha carteira');return parts.join(' · ');}
function renderQuadro(){
  const cls=S.cls,{rows,act}=filtered(),hasF=act.length||S.port||S.setor;
  const ap=S.applied&&S.filters[cls].find(f=>f.id===S.applied);const mod=ap&&!sameF(ap,curFilter());
  const setores=[...new Set(DB[cls].map(r=>r.setor))].sort();
  const fs=S.filters[cls];
  const bar=`<div class="bar" role="group" aria-label="Filtros de fundamentos"><span class="fl">Filtros de fundamentos</span>
   <span class="pills" role="group" aria-label="Janela de anos">${[3,5,10].map(w=>`<button type="button" class="pill" data-w="${w}" aria-pressed="${S.win===w}">${w} anos</button>`).join('')}</span>
   <span class="chiprail">${CRIT[cls].map(c=>`<button type="button" class="chip" data-fc="${c[0]}" aria-pressed="${!!S.crit[c[0]]}"><span class="ck" aria-hidden="true"></span>${esc(c[1])}</button>`).join('')}
   <button type="button" class="chip" data-fport aria-pressed="${S.port}"><span class="ck" aria-hidden="true"></span>Na minha carteira</button>
   <span style="position:relative;display:inline-flex"><button type="button" class="chip" data-setorbtn aria-haspopup="true" aria-expanded="${!!S.setorOpen}" aria-pressed="${!!S.setor}">${S.setor?esc(S.setor):(cls==='acoes'?'Setor':'Segmento')} ▾</button>
   ${S.setorOpen?`<div class="popover" role="menu" style="top:calc(100% + 6px);left:0">${['Todos',...setores].map(s=>`<button type="button" role="menuitemradio" aria-checked="${(S.setor||'Todos')===s}" data-setor="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</span></span>
   ${hasF?'<button type="button" class="link" data-fclear>Limpar filtros</button>':''}</div>
  <div class="bar2"><span class="meta" aria-live="polite">${act.length?`<b>${rows.length}</b> de ${DB[cls].length} atendem a ${act.length} critério${act.length>1?'s':''} em ${S.win} anos`:`<b>${rows.length}</b> de ${DB[cls].length}`} <span class="mut">(amostra do protótipo; ${TOTAL[cls]} no app)</span></span><span style="flex:1"></span>
   <span class="fsbar"><button type="button" class="btn sm" id="btn-fsaved" data-fsaved aria-haspopup="dialog" ${S.acting?'disabled title="Filtros salvos são pessoais e não aparecem no modo consultor."':''}>${ic('filt')}Filtros salvos${fs.length?` <span class="mut">(${fs.length})</span>`:''}</button>
   ${hasF&&!ap?`<button type="button" class="btn sm" id="btn-fsave" data-fsave ${S.acting?'disabled title="Filtros salvos são pessoais e não aparecem no modo consultor."':''}>${ic('bm')}Salvar filtros</button>`:''}</span></div>
  ${ap?`<div class="fapplied" role="status">${ic('filt')}<span>Filtro salvo: <b>${esc(ap.nome)}</b></span>${mod?'<span class="mod">alterado</span>':''}<span class="sp"></span>${mod?`<button type="button" class="btn sm" data-fupdate>Salvar alterações</button><button type="button" class="btn sm" data-fsave>Salvar como novo</button>`:''}<button type="button" class="icon44" data-funapply aria-label="Tirar o filtro salvo ${esc(ap.nome)}">${ic('x')}</button></div>`:''}`;
  if(S.estado==='loading')return bar+skeleton();if(S.estado==='error')return bar+errBox('o Quadro');
  const cols=cls==='acoes'?['Ativo','Preço','Lucros seguidos','ROE','P/L','P/VP','DY 12m','Critérios','Na carteira']:['Fundo','Tipo','Cota','DY 12m','P/VP','Vacância (CVM)','Critérios','Na carteira'];
  const cells=r=>cls==='acoes'?[tkCell(r),money(r.preco),streak(r.streak),pct(r.roe),r.pl==null?'<span class="mut">—</span>':fmtN(r.pl,1),r.pvp==null?'<span class="mut">—</span>':fmtN(r.pvp,2),pct(r.dy),critCell(cls,r,S.win),portCell(r.t,cls)]
     :[tkCell(r),r.tipo,money(r.preco),pct(r.dy),fmtN(r.pvp,2),r.tipo!=='Tijolo'?'<span class="mut">n/a</span>':pct(r.vac,false),critCell(cls,r,S.win),portCell(r.t,cls)];
  const empty=`<tr><td colspan="${cols.length+1}" class="empty">Nenhum ativo atende a todos os critérios selecionados em ${S.win} anos. Experimente uma janela menor ou menos critérios — ou <button type="button" class="link inl" data-fclear>limpe os filtros</button>.</td></tr>`;
  const table=`<div class="tbl-wrap qtable"><table class="tbl"><caption class="sr">Quadro de ${CLS[cls].label}</caption><thead><tr>${cols.map((c,i)=>`<th scope="col" ${i===0?'aria-sort="ascending"':''}><span>${c}${i===0?' ▲':''}</span></th>`).join('')}<th scope="col"><span><span class="sr">Salvar</span>${ic('bm')}</span></th></tr></thead>
   <tbody>${rows.map(r=>`<tr class="click" data-row="${r.t}">${cells(r).map(c=>`<td>${c}</td>`).join('')}<td class="bmc">${bmBtn(r.t)}</td></tr>`).join('')||empty}</tbody></table></div>`;
  const kv=cls==='acoes'?[['ROE',r=>pct(r.roe)],['P/L',r=>r.pl==null?'—':fmtN(r.pl,1)],['DY 12m',r=>pct(r.dy)]]:[['DY 12m',r=>pct(r.dy)],['P/VP',r=>fmtN(r.pvp,2)],['Vacância (CVM)',r=>r.tipo!=='Tijolo'?'n/a':pct(r.vac,false)]];
  const cards=`<div class="qcards">${rows.map(r=>`<div class="qc" data-row="${r.t}"><div class="top">${tkCell(r)}<span class="act"><span class="pr">${money(r.preco)}</span>${bmBtn(r.t)}</span></div><dl>${kv.map(([l,f])=>`<div><dt>${l}</dt><dd>${f(r)}</dd></div>`).join('')}</dl><div class="bot">${critCell(cls,r,S.win)}${portCell(r.t,cls)}</div></div>`).join('')||`<p class="empty">Nenhum ativo atende a todos os critérios selecionados em ${S.win} anos.</p>`}</div>`;
  return bar+`<div class="tbl-pad">${table}${cards}<p class="note c" data-texto-legal="rodape-quadro">Os filtros e a coluna "Critérios" verificam, ano a ano, dados contábeis históricos das demonstrações financeiras públicas. Nenhum critério é opinião do My Finance, e atender a mais critérios não significa ser melhor investimento. <b>Rentabilidade passada não é garantia de resultados futuros.</b></p></div>`;
}

/* ---------------- Salvos ---------------- */
function renderSalvos(){
  if(S.estado==='loading')return `<div class="lrail" aria-busy="true">${[1,2,3].map(()=>'<span class="skel" style="width:120px;height:44px;border-radius:10px"></span>').join('')}</div>`+skeleton(5);
  if(S.estado==='error')return errBox('suas listas');
  const u=unread();
  const seg=S.flagAlertas?`<div class="hd"><h3>Salvos</h3><span class="segw" role="group" aria-label="Ver"><button type="button" data-sv="listas" aria-pressed="${S.sv==='listas'}">${ic('list')}Listas</button><button type="button" data-sv="alertas" aria-pressed="${S.sv==='alertas'}">${ic('bell')}Alertas${u?`<span class="cnt" aria-label="${u} novos">${u}</span>`:''}</button></span></div>`:'';
  if(S.acting)return `<div class="estado"><span class="eic">${ic('bm')}</span><h3>Salvos não aparece no modo consultor</h3><p>As listas, os filtros e as comparações salvas são pessoais de cada usuário, como a Minha tese. Para ver os dados de um ativo da cliente, use o Quadro ou a página do ativo.</p><div class="row"><button type="button" class="btn" data-p="quadro">Ir para o Quadro</button></div></div>`;
  if(S.sv==='alertas'&&S.flagAlertas)return seg+renderAlertas();
  if(!S.lists.length)return seg+`<div class="estado"><span class="eic">${ic('bm')}</span><h3>Você ainda não tem listas</h3><p>Crie listas para acompanhar ativos com os mesmos dados do Quadro: critérios, preço, DY e o que você tem na Carteira. Para salvar um ativo, use o botão Salvar na página dele ou o marcador em cada linha do Quadro.</p><div class="row"><button type="button" class="btn n" data-newlist>${ic('plus')}Criar lista</button><button type="button" class="btn" data-p="quadro">Ir para o Quadro</button></div></div>`;
  const L=S.lists.find(l=>l.id===S.activeList)||S.lists[0];
  const rail=`<div class="lrail" role="list" aria-label="Suas listas">${S.lists.map(l=>`<span role="listitem"><button type="button" class="lchip" data-list="${l.id}" aria-current="${l.id===L.id}">${esc(l.nome)}<span class="n">${l.itens.length}</span>${S.flagAlertas&&alOn(l.al)?`<span class="sr">, alertas ligados</span>${ic('bell','bell')}`:''}</button></span>`).join('')}<span role="listitem"><button type="button" class="lchip add" data-newlist>${ic('plus')}Nova lista</button></span></div>`;
  const items=L.itens.map(rowOf);const by={acoes:items.filter(r=>clsOf(r.t)==='acoes'),fiis:items.filter(r=>clsOf(r.t)==='fiis')};
  const al=AL_TIPOS.filter(a=>L.al[a[0]]).map(a=>a[1].toLowerCase());
  const head=`<div class="lhead"><div><h2>${esc(L.nome)}</h2><p>${L.itens.length} ${L.itens.length===1?'ativo':'ativos'} · criada em ${L.criada}${S.flagAlertas?` · alertas: ${al.length?al.join(', '):'nenhum ligado'}`:''}</p></div>
   <div class="acts">${S.flagAlertas?`<button type="button" class="btn sm" id="btn-alcfg" data-alcfg="${L.id}">${ic('bell')}<span class="lbl">Alertas da lista</span><span class="sr">Alertas da lista</span></button>`:''}<button type="button" class="btn sm" id="btn-ren" data-ren="${L.id}">${ic('pen')}<span class="lbl">Renomear</span><span class="sr">Renomear lista</span></button><button type="button" class="btn sm" id="btn-del" data-del="${L.id}">${ic('trash')}<span class="lbl">Apagar lista</span><span class="sr">Apagar lista</span></button></div></div>`;

  const table=`<div class="tbl-pad" style="padding-top:14px"><div class="tbl-wrap ctable"><table class="tbl cmp"><caption class="sr">Comparação</caption><thead><tr><th scope="col"><span>Critério</span></th>${rows.map(r=>`<th scope="col"><span>${r.t}</span></th>`).join('')}</tr></thead><tbody>
   <tr class="grp"><td colspan="${rows.length+1}">Critérios de fundamentos · ${S.cmpWin} anos</td></tr>
   ${cr.map((c,i)=>`<tr><td class="lbl">${esc(c[1])}</td>${rows.map(r=>`<td>${bits(r,S.cmpWin)[i]?'✓':'—'}<span class="sr">${bits(r,S.cmpWin)[i]?'atende':'não atende'}</span></td>`).join('')}</tr>`).join('')}
   <tr class="tot"><td class="lbl" style="color:var(--ink);font-weight:600">Critérios atendidos</td>${rows.map(r=>`<td><b>${cnt(r,S.cmpWin)} de 6</b></td>`).join('')}</tr>

let opener=null;
function openModal(html,size){closePop(true);if(!modalRoot.innerHTML)opener=document.activeElement;
  modalRoot.innerHTML=`<div class="modal" data-mback><div class="mbox ${size||''}" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  const f=modalRoot.querySelector('[data-autofocus]')||modalRoot.querySelector('input,button:not([data-mclose])');f&&f.focus();}
function closeModal(){modalRoot.innerHTML='';popKind=null;if(opener&&document.body.contains(opener))opener.focus();else if(opener&&opener.id){const el=document.getElementById(opener.id);el&&el.focus();}opener=null;}
function mhead(t,s){return `<div class="mhead"><div><h3 id="m-title">${t}</h3>${s?`<p>${s}</p>`:''}</div><button type="button" class="mclose" data-mclose aria-label="Fechar">×</button></div>`;}
let popOpener=null,popKind=null;
function openPop(html,anchor,kind,label){ // popover no desktop, BottomSheet no celular
  if(narrow()){popKind=kind;openModal(`${html}`,'sm');modalRoot.querySelector('.mbox').setAttribute('aria-label',label);modalRoot.querySelector('.mbox').removeAttribute('aria-labelledby');return;}
  popOpener=anchor;popKind=kind;
  popRoot.innerHTML=`<div class="pop" role="dialog" aria-label="${esc(label)}">${html}</div>`;
  const p=popRoot.firstChild,r=anchor.getBoundingClientRect(),ar=app.closest('.phone')?app.getBoundingClientRect():{left:0,top:0};
  const w=p.offsetWidth;let left=Math.min(r.right-w,(app.closest('.phone')?ar.left+app.clientWidth:window.innerWidth)-w-12);left=Math.max(12,left);
  let top=r.bottom+6;if(top+p.offsetHeight>window.innerHeight-12)top=Math.max(12,r.top-p.offsetHeight-6);
  p.style.left=(left-ar.left)+'px';p.style.top=(top-ar.top)+'px';
  const f=p.querySelector('[data-autofocus]')||p.querySelector('input,button');f&&f.focus();
}
function closePop(silent){if(!popRoot.innerHTML){if(popKind&&modalRoot.innerHTML&&!silent){}return;}popRoot.innerHTML='';if(!silent&&popOpener&&document.body.contains(popOpener))popOpener.focus();else if(!silent&&popOpener&&popOpener.id){const e=document.getElementById(popOpener.id);e&&e.focus();}popOpener=null;popKind=null;}
function refreshPop(){ // re-render do conteúdo do popover/sheet aberto
  if(popKind&&popKind.startsWith('choose:')){const html=chooserHtml(popKind.slice(7));const host=popRoot.querySelector('.pop')||modalRoot.querySelector('.mbox');if(host){const fid=document.activeElement&&document.activeElement.id;host.innerHTML=(host.classList.contains('mbox')?'<div class="grab" aria-hidden="true"></div>':'')+html;const el=fid&&document.getElementById(fid);el&&el.focus();}}
  if(popKind==='fsaved'){const host=popRoot.querySelector('.pop')||modalRoot.querySelector('.mbox');if(host){host.innerHTML=(host.classList.contains('mbox')?'<div class="grab" aria-hidden="true"></div>':'')+fsavedHtml();}}
  if(popKind==='csaved'){const host=popRoot.querySelector('.pop')||modalRoot.querySelector('.mbox');if(host){host.innerHTML=(host.classList.contains('mbox')?'<div class="grab" aria-hidden="true"></div>':'')+csavedHtml();}}
}
function trap(e,root){if(e.key!=='Tab')return;const f=$$('button:not([disabled]),input:not([disabled]),a[href],select',root).filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}
