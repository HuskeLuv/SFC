/* ---------------- eventos ---------------- */
document.addEventListener('click',e=>{
  if(e.target.matches&&e.target.matches('.modal[data-mback]')){closeModal();return;}
  const t=e.target.closest('button,a,[data-row],input,label');
  // fechar popovers ao clicar fora
  if(popRoot.innerHTML&&!e.target.closest('.pop')&&!(t&&(t.dataset.bm||'save' in t.dataset||'fsaved' in t.dataset||'csaved' in t.dataset))){closePop(true);}
  if(S.bell&&!e.target.closest('.ndrop,[data-bell]')){S.bell=false;render();}
  if(S.setorOpen&&!e.target.closest('[data-setorbtn],.popover')){S.setorOpen=false;render();}
  if(!t||!app.contains(t))return;const d=t.dataset;
  if('mclose' in d){closeModal();return;}
  if('popclose' in d||'popdone' in d){if(modalRoot.innerHTML&&!popRoot.innerHTML){closeModal();}else closePop();popKind=null;return;}
  if('toastact' in d)return;
  if(t.classList.contains('crit')){e.stopPropagation();const r=t.getBoundingClientRect();if(tip.hidden){tip.innerHTML=t.dataset.tip;tip.hidden=false;const ar=app.closest('.phone')?app.getBoundingClientRect():{left:0,top:0};tip.style.left=Math.max(8,r.left-ar.left)+'px';tip.style.top=(r.bottom+6-ar.top)+'px';}else tip.hidden=true;return;}
  if(d.open){e.preventDefault();closeModal();closePop(true);S.bell=false;S.t=d.open;S.cls=clsOf(d.open);S.page='ativo';render();scrollTop();$('#pg-h')?.focus({preventScroll:true});return;}
  if(d.bm){e.stopPropagation();saveAction(d.bm,t);return;}
  if('save' in d){saveAction(S.t,t);return;}
  if(d.row&&!e.target.closest('button,a,input,label')){S.t=d.row;S.cls=clsOf(d.row);S.page='ativo';render();scrollTop();return;}
  if('back' in d){S.page='quadro';render();return;}
  if(d.p){S.page=d.p;closeModal();if(d.p==='salvos')S.sv='listas';render();scrollTop();return;}
  if(d.cls){S.cls=d.cls;if(S.page==='quadro'){S.crit={};S.setor=null;S.port=false;S.applied=null;}render();return;}
  if('bell' in d){S.bell=!S.bell;render();if(S.bell)$('.ndrop button')?.focus();else $('#bell').focus();return;}
  if('readall' in d){S.alerts.forEach(a=>a.novo=false);render();toast('Alertas marcados como lidos.');return;}
  if('goal' in d){S.bell=false;S.page='salvos';S.sv='alertas';render();scrollTop();return;}
  if('newlist' in d){openListForm('new');return;}
  if(d.newlistFor){const x=d.newlistFor;closePop(true);if(modalRoot.innerHTML)modalRoot.innerHTML='';openListForm('new',null,x);return;}
  if(d.list){S.activeList=d.list;render();return;}
  if(d.golist){S.activeList=d.golist;S.page='salvos';S.sv='listas';S.cls=clsOf(S.t);render();scrollTop();return;}
  if(d.ren){openListForm('ren',d.ren);return;}
  if(d.del){openDelete(d.del);return;}
  if(d.delok){const L=S.lists.find(l=>l.id===d.delok);S.lists=S.lists.filter(l=>l.id!==d.delok);S.activeList=S.lists[0]?.id||null;closeModal();render();toast(`Lista <b>${esc(L.nome)}</b> apagada.`);$('[data-list]')?.focus();return;}
  if(d.rm){e.stopPropagation();const L=S.lists.find(l=>l.id===S.activeList);const x=d.rm,idx=L.itens.indexOf(x);L.itens=L.itens.filter(y=>y!==x);render();toast(`<b>${x}</b> removido de <b>${esc(L.nome)}</b>.`,{l:'Desfazer',fn:()=>{L.itens.splice(idx,0,x);render();}});return;}
  if(d.sv){S.sv=d.sv;render();return;}
  if(d.alcfg){openAlCfg(d.alcfg);return;}
  if(d.alk!==undefined&&t.getAttribute('role')==='switch'){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return;}
  if(d.alsave){const L=S.lists.find(l=>l.id===d.alsave);$$('#alcfg [data-alk]').forEach(s=>L.al[s.dataset.alk]=s.getAttribute('aria-checked')==='true');
    closeModal();render();toast(alOn(L.al)?`Alertas de <b>${esc(L.nome)}</b> salvos.`:`Alertas de <b>${esc(L.nome)}</b> desligados.`);return;}
  if(d.pref&&t.getAttribute('role')==='switch'&&!t.disabled){S.prefs[d.pref]=!S.prefs[d.pref];render();toast(d.pref==='push'?(S.prefs.push?'Notificações no celular ligadas para a Análise de Ativos.':'Notificações no celular desligadas para a Análise de Ativos. Os alertas seguem no sino.'):'');return;}
  // Quadro
  if(d.w){S.win=+d.w;render();return;}
  if(d.fc){S.crit[d.fc]=!S.crit[d.fc];render();return;}
  if('fport' in d){S.port=!S.port;render();return;}
  if('setorbtn' in d){e.stopPropagation();S.setorOpen=!S.setorOpen;render();return;}
  if(d.setor){S.setor=d.setor==='Todos'?null:d.setor;S.setorOpen=false;render();return;}
  if('fclear' in d){S.crit={};S.port=false;S.setor=null;S.applied=null;render();return;}
  if('fsaved' in d){e.stopPropagation();if(popKind==='fsaved'&&popRoot.innerHTML){closePop();return;}S.fdel=null;openPop(fsavedHtml(),t,'fsaved','Filtros salvos');return;}
  if('fsave' in d){openFSave();return;}
  if(d.fapply){const f=S.filters[S.cls].find(x=>x.id===d.fapply);S.win=f.win;S.crit={};f.crit.forEach(c=>S.crit[c]=true);S.setor=f.setor;S.port=f.port;S.applied=f.id;
    if(modalRoot.innerHTML)modalRoot.innerHTML='';closePop(true);render();const n=filtered().rows.length;toast(`Filtro <b>${esc(f.nome)}</b> aplicado: ${n} de ${DB[S.cls].length} atendem.`);$('#btn-fsaved')?.focus();return;}
  if(d.fdel){S.fdel=d.fdel;refreshPop();(popRoot.querySelector('[data-autofocus]')||modalRoot.querySelector('[data-autofocus]'))?.focus();return;}
  if('fdelno' in d){const id=S.fdel;S.fdel=null;refreshPop();document.getElementById('fdel-'+id)?.focus();return;}
  if(d.fdelok){const f=S.filters[S.cls].find(x=>x.id===d.fdelok);S.filters[S.cls]=S.filters[S.cls].filter(x=>x.id!==d.fdelok);if(S.applied===d.fdelok)S.applied=null;S.fdel=null;render();refreshPop();toast(`Filtro <b>${esc(f.nome)}</b> apagado.`);return;}
  if('fupdate' in d){const f=S.filters[S.cls].find(x=>x.id===S.applied);Object.assign(f,curFilter());render();toast(`Filtro <b>${esc(f.nome)}</b> atualizado.`);return;}
  if('funapply' in d){S.applied=null;render();$('#btn-fsaved')?.focus();return;}
  // Comparador
  if(d.cw){S.cmpWin=+d.cw;render();return;}
  if(d.crm){S.cmp[S.cls]=S.cmp[S.cls].filter(x=>x!==d.crm);render();return;}
  if(d.cadd){if(S.cmp[S.cls].length<4)S.cmp[S.cls].push(d.cadd);render();return;}
  if('copy' in d){const url=`/analise-ativos/comparador?classe=${S.cls}&ativos=${S.cmp[S.cls].join(',')}&janela=${S.cmpWin}`;try{navigator.clipboard.writeText(location.origin+url).then(()=>toast('Link da comparação copiado.'),()=>toast('Link: '+url));}catch(err){toast('Link: '+url);}return;}
  if('csave' in d){if(S.acting)return;if(cmpSaved()){openPop(csavedHtml(),t,'csaved','Comparações salvas');return;}if(S.comps.length>=LIM.comp){toast(`Você chegou a ${LIM.comp} comparações salvas. Apague uma em Salvas para guardar outra.`);return;}openCSave();return;}
  if('csaved' in d){e.stopPropagation();if(popKind==='csaved'&&popRoot.innerHTML){closePop();return;}S.cdel=null;openPop(csavedHtml(),t,'csaved','Comparações salvas');return;}
  if(d.copen){const c=S.comps.find(x=>x.id===d.copen);S.cls=c.cls;S.cmp[c.cls]=c.t.slice();S.cmpWin=c.win;if(modalRoot.innerHTML)modalRoot.innerHTML='';closePop(true);S.page='compare';render();toast(`Comparação <b>${esc(c.nome)}</b> aberta com os dados de hoje.`);return;}
  if(d.cdel){S.cdel=d.cdel;refreshPop();(popRoot.querySelector('[data-autofocus]')||modalRoot.querySelector('[data-autofocus]'))?.focus();return;}
  if('cdelno' in d){const id=S.cdel;S.cdel=null;refreshPop();document.getElementById('cdel-'+id)?.focus();return;}
  if(d.cdelok){const c=S.comps.find(x=>x.id===d.cdelok);S.comps=S.comps.filter(x=>x.id!==d.cdelok);S.cdel=null;render();refreshPop();toast(`Comparação <b>${esc(c.nome)}</b> apagada.`);return;}
  if('pdf' in d){openPdf();return;}
  if('pdfgo' in d){if(S.pdf.busy)return;S.pdf.busy=true;t.setAttribute('aria-busy','true');t.innerHTML='<span class="spin" aria-hidden="true"></span>Gerando PDF…';
    setTimeout(()=>{S.pdf.busy=false;if(S.estado==='error'){t.removeAttribute('aria-busy');t.innerHTML=ic('pdf')+'Tentar de novo';$('#pdf-err').textContent='Não foi possível gerar o PDF agora. A comparação continua aberta; tente de novo em alguns minutos.';return;}
      if(S.pdf.ios){S.pdf.ready=true;openPdf(false);return;}
      closeModal();toast(`PDF pronto: <b>${pdfName()}</b>`);},1200);return;}
  if('pdfshare' in d){closeModal();toast(`PDF pronto: <b>${pdfName()}</b>`);return;}
  if('retry' in d){S.estado='ok';syncBench();render();return;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.tl){const L=S.lists.find(l=>l.id===t.dataset.tl),x=t.dataset.t;if(t.checked)L.itens.push(x);else L.itens=L.itens.filter(y=>y!==x);
    const ls=listsOf(x);render();refreshPop();const live=$('#toastRoot');toast(t.checked?`<b>${x}</b> salvo em <b>${esc(L.nome)}</b>.`:`<b>${x}</b> removido de <b>${esc(L.nome)}</b>.`);return;}
});
document.addEventListener('input',e=>{if(e.target.id==='lf-nome'){$('#lf-cnt').textContent=e.target.value.length;if(e.target.getAttribute('aria-invalid')==='true')validateName(true);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='lf')submitList();
  if(f.id==='ff'){const v=$('#ff-nome').value.trim();if(!v){$('#ff-err').textContent='Dê um nome ao filtro.';$('#ff-nome').focus();return;}
    const ex=S.filters[S.cls].find(x=>x.nome.toLowerCase()===v.toLowerCase());if(ex){$('#ff-err').textContent='Você já tem um filtro com esse nome. Escolha outro.';$('#ff-nome').focus();return;}
    const nf={id:'f'+Date.now(),nome:v,...curFilter(),em:'16/10/2026'};S.filters[S.cls].unshift(nf);S.applied=nf.id;closeModal();render();toast(`Filtro <b>${esc(v)}</b> salvo. Ele fica em Filtros salvos.`);$('#btn-fsaved')?.focus();}
  if(f.id==='cf'){const v=$('#cf-nome').value.trim();if(!v){$('#cf-err').textContent='Dê um nome à comparação.';return;}S.comps.unshift({id:'c'+Date.now(),nome:v,cls:S.cls,t:S.cmp[S.cls].slice(),win:S.cmpWin,em:'16/10/2026'});closeModal();render();toast(`Comparação <b>${esc(v)}</b> salva.`,{l:'Ver salvas',fn:()=>{const b=$('#btn-csaved');b&&openPop(csavedHtml(),b,'csaved','Comparações salvas');}});$('#btn-csave')?.focus();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(popRoot.innerHTML){closePop();return;}if(modalRoot.innerHTML){closeModal();return;}if(S.bell){S.bell=false;render();$('#bell').focus();return;}if(!tip.hidden)tip.hidden=true;}
  if(modalRoot.innerHTML)trap(e,modalRoot);else if(popRoot.innerHTML)trap(e,popRoot);
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)&&!modalRoot.innerHTML){e.preventDefault();$('#q')?.focus();}
});
window.addEventListener('resize',()=>closePop(true));
$('.shell').addEventListener('scroll',()=>closePop(true));window.addEventListener('scroll',()=>closePop(true),{passive:true});

const root=document.documentElement;
function setTheme(v){if(v==='sys')root.removeAttribute('data-theme');else root.setAttribute('data-theme',v);syncBench();}
function widMode(){const fw=$('#fw');return fw.classList.contains('w320')?'320':fw.classList.contains('phone')?'390':fw.classList.contains('desk')?'1440':'auto';}
function syncBench(){
  $$('[data-theme-b]').forEach(b=>b.setAttribute('aria-pressed',(root.getAttribute('data-theme')||'sys')===b.dataset.themeB));
  $$('[data-est]').forEach(b=>b.setAttribute('aria-pressed',S.estado===b.dataset.est));
  $$('[data-wid]').forEach(b=>b.setAttribute('aria-pressed',widMode()===b.dataset.wid));
  $('#scen').value=S.scen;
}
function go(v){
  modalRoot.innerHTML='';closePop(true);S.bell=false;S.estado='ok';S.rank=false;S.pdf.ios=false;S.pdf.lim=false;S.crit={};S.setor=null;S.port=false;S.applied=null;S.win=5;
  if(v==='al-empty'||v==='s-empty'){seed('novo');S.autoSeed=true;}else if(v==='m-new-lim'){seed('limite');S.autoSeed=true;}else if(S.autoSeed){seed('padrao');S.autoSeed=false;}
  const n=$('#benchNote');n.textContent=NOTES[v]||'';
  switch(v){
   case 'q':S.page='quadro';S.cls='acoes';break;
   case 'q-rank':S.page='quadro';S.cls='acoes';S.rank=true;break;
   case 'q-row':S.page='quadro';S.cls='acoes';render();saveAction('TAEE11',$('[data-bm="TAEE11"]:not([hidden])')&&[...$$('[data-bm="TAEE11"]')].find(b=>b.offsetParent));syncBench();return;
   case 'q-fsave':S.page='quadro';S.cls='acoes';S.crit={rec:true,luc:true};S.setor='Utilidade Pública';render();openFSave();syncBench();return;
   case 'q-flist':S.page='quadro';S.cls='acoes';render();openPop(fsavedHtml(),$('#btn-fsaved'),'fsaved','Filtros salvos');syncBench();return;
   case 'q-fapplied':{S.page='quadro';S.cls='acoes';const f=S.filters.acoes[0];S.win=f.win;f.crit.forEach(c=>S.crit[c]=true);S.setor=f.setor;S.applied=f.id;S.crit.ebit=true;break;}
   case 'm-new':case 'm-new-lim':S.page='salvos';S.sv='listas';render();openListForm('new');syncBench();return;
   case 'm-new-err':S.page='salvos';S.sv='listas';render();openListForm('new',null,null,'dividendos');syncBench();return;
   case 'm-ren':S.page='salvos';S.sv='listas';S.activeList='l2';render();openListForm('ren','l2');syncBench();return;
   case 'm-del':S.page='salvos';S.sv='listas';S.activeList='l1';render();openDelete('l1');syncBench();return;
   case 'a':S.page='ativo';S.t='WEGE3';S.cls='acoes';break;
   case 'a-saved':S.page='ativo';S.t='TAEE11';S.cls='acoes';break;
   case 'a-choose':S.page='ativo';S.t='TAEE11';S.cls='acoes';render();saveAction('TAEE11',$('#btn-save'));syncBench();return;
   case 's':S.page='salvos';S.sv='listas';S.activeList='l1';S.cls='acoes';break;
   case 's-fii':S.page='salvos';S.sv='listas';S.activeList='l1';S.cls='fiis';break;
   case 's-listempty':S.page='salvos';S.sv='listas';S.activeList='l3';S.cls='acoes';break;
   case 's-empty':S.page='salvos';S.sv='listas';break;
   case 'c':S.page='compare';S.cls='acoes';S.cmp.acoes=['WEGE3','BBAS3','TAEE11'];S.cmpWin=5;break;
   case 'c-save':S.page='compare';S.cls='acoes';S.cmp.acoes=['WEGE3','BBAS3','TAEE11'];S.cmpWin=5;render();openCSave();syncBench();return;
   case 'c-saved':S.page='compare';S.cls='acoes';render();openPop(csavedHtml(),$('#btn-csaved'),'csaved','Comparações salvas');syncBench();return;
   case 'c-pdf-ios':case 'c-pdf-lim':S.page='compare';S.cls='acoes';S.cmp.acoes=['WEGE3','BBAS3','TAEE11'];S.cmpWin=5;if(v==='c-pdf-ios'){S.pdf.ios=true;}render();openPdf();if(v==='c-pdf-lim'){S.pdf.lim=true;openPdf(false);}if(v==='c-pdf-ios'){S.pdf.ready=true;openPdf(false);}syncBench();return;
   case 'c-pdf':S.page='compare';S.cls='acoes';S.cmp.acoes=['WEGE3','BBAS3','TAEE11'];S.cmpWin=5;render();openPdf();syncBench();return;
   case 'al':case 'al-empty':S.page='salvos';S.sv='alertas';S.cls='acoes';break;
   case 'al-cfg':S.page='salvos';S.sv='listas';S.activeList='l2';S.cls='acoes';render();openAlCfg('l2');syncBench();return;
   case 'bell':S.page='quadro';S.bell=true;break;
  }
  syncBench();render();scrollTop();
}
$('.bench').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.themeB)setTheme(b.dataset.themeB);
  if(b.dataset.est){S.estado=b.dataset.est;syncBench();render();}
  if(b.dataset.wid){const fw=$('#fw');fw.classList.remove('phone','w320','desk');if(b.dataset.wid==='390')fw.classList.add('phone');if(b.dataset.wid==='320')fw.classList.add('phone','w320');if(b.dataset.wid==='1440')fw.classList.add('desk');closePop(true);syncBench();render();}
});
$('#goto').addEventListener('change',e=>{if(e.target.value)go(e.target.value);e.target.value='';});
$('#scen').addEventListener('change',e=>{seed(e.target.value);S.autoSeed=false;modalRoot.innerHTML='';closePop(true);if(!S.flagAlertas)S.sv='listas';$('#benchNote').textContent={novo:'Usuário novo: nenhuma lista, filtro, comparação ou alerta.',limite:'No limite: 20 listas e 500 ativos salvos na conta (200 por lista).',consultor:'Consultor agindo por cliente (regra da tese e dos cenários): Salvos vazio com podeSalvar=false, Criar lista/Salvar/Salvar filtros/Salvar comparação desabilitados; PDF liberado (sem dado pessoal).',pushoff:'Push desligado no aparelho: a chave da área fica desabilitada com o caminho para o Perfil.',semalertas:'ANALISE_ATIVOS_ALERTAS_HABILITADO desligada: some o segmento Alertas, a linha de alertas no ativo, a frase do aviso no Salvar e a opção no Criar lista.',padrao:'Usuário com 3 listas, 3 filtros salvos, 3 comparações e 6 alertas.'}[S.scen];syncBench();render();});
function benchH(){root.style.setProperty('--bench-h',Math.max(0,$('.bench').getBoundingClientRect().bottom)+'px');}
window.addEventListener('scroll',benchH,{passive:true});window.addEventListener('resize',benchH);benchH();
syncBench();go('q');
</script>
